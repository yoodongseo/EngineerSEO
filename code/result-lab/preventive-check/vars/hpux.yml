---
system: "{{ vendor }}_2_3_4_5_6"

inspection_commands:
- rule_key: "cpu_usage"
  cmd_id: "0001"
  name: "01.CPU 점검"
  command: "sar -u 1 3"
  os: "{{ vendor }}"
  inspection_criteria: 70
  is_compare: true
  is_save: true
  timeout: 1
  sleep: 1
  message: "{{ message_data }}"

- rule_key: "cpu_core"
  cmd_id: "0002"
  name: "02.CPU 코어별 상태 점검"
  command: "ioscan -fnC processor"
  os: "{{ vendor }}"
  inspection_criteria: "CLAIMED"
  is_compare: true
  is_save: true
  timeout: 1
  sleep: 1
  message: "{{ message_data }}"

- rule_key: "memory_usage"
  cmd_id: "0003"
  name: "03.Memory 사용률"
  command: "swapinfo -tam"
  os: "{{ vendor }}"
  inspection_criteria:
  - "memory"
  - 80
  is_compare: true
  is_save: true
  timeout: 1
  sleep: 1
  message: "{{ message_data }}"

- rule_key: "memory_scan"
  cmd_id: "0004"
  name: "04.Memory 상태 확인"
  command: "machinfo | awk '/Memory/{flag=1} flag{print} /^$/{flag=0}'"
  os: "{{ vendor }}"
  inspection_criteria: ""
  is_compare: true
  is_save: true
  timeout: 1
  sleep: 1
  message: "{{ message_data }}"

- rule_key: "paging_space"
  cmd_id: "0005"
  name: "05.Paging Space"
  command: "swapinfo -tam"
  os: "{{ vendor }}"
  inspection_criteria:
  - "total"
  - 50
  is_compare: true
  is_save: true
  timeout: 1
  sleep: 1
  message: "{{ message_data }}"

- rule_key: "filesystem_usage"
  cmd_id: "0006"
  name: "06.파일시스템 사용량"
  command: "bdf"
  os: "{{ vendor }}"
  inspection_criteria: 80
  is_compare: true
  is_save: true
  timeout: 1
  sleep: 1
  message: "{{ message_data }}"

- rule_key: "disk_swap_usage"
  cmd_id: "0007"
  name: "07.Disk Swap 사용률"
  command: "swapinfo -tam"
  os: "{{ vendor }}"
  inspection_criteria:
  - "dev"
  - 50
  is_compare: true
  is_save: true
  timeout: 1
  sleep: 1
  message: "{{ message_data }}"

- rule_key: "disk_redundancy"
  cmd_id: "0008"
  name: "08.DISK 이중화 정상 여부"
  command: "ioscan -fnC fc"
  os: "{{ vendor }}"
  inspection_criteria:
  - "NO_HW"
  - "ERROR"
  - "UNCLAIMED"
  is_compare: true
  is_save: true
  timeout: 1
  sleep: 1
  message: "{{ message_data }}"

- rule_key: "dev_stat"
  cmd_id: "0009"
  name: "09.DISK 인식 여부 점검"
  command: "ioscan -fnC disk"
  os: "{{ vendor }}"
  inspection_criteria: [ "NO_HW", "ERROR", "UNCLAIMED" ]
  is_compare: true
  is_save: true
  timeout: 1
  sleep: 1
  message: "{{ message_data }}"

- rule_key: "disk_stat"
  cmd_id: "0010"
  name: "10.DISK I/O 점검"
  command: "sar -d 3 2"
  os: "{{ vendor }}"
  inspection_criteria: 20
  is_compare: true
  is_save: true
  timeout: 10
  sleep: 1
  message: "{{ message_data }}"

- rule_key: "inode_usage"
  cmd_id: "0011"
  name: "11.DISK I-Node 정상여부"
  command: "bdf -i"
  os: "{{ vendor }}"
  inspection_criteria: "80"
  is_compare: true
  is_save: true
  timeout: 1
  sleep: 1
  message: "{{ message_data }}"

- rule_key: "kernel_parameter"
  cmd_id: "0012"
  name: "12.Kernel parameter Check"
  command: "kctune"
  os: "{{ vendor }}"
  inspection_criteria: 80
  is_compare: true
  is_save: true
  timeout: 1
  sleep: 1
  message: "{{ message_data }}"

- rule_key: "system_log"
  cmd_id: "0013"
  name: "13.로그 점검"
  command: "tail -300 /var/adm/syslog/syslog.log"
  os: "{{ vendor }}"
  inspection_criteria: [ 'panic', 'hard error', 'transport error', 'memory allocation fail' ]
  is_compare: true
  is_save: true
  timeout: 1
  sleep: 1
  message: "{{ message_data }}"

- rule_key: "cluster_status"
  cmd_id: "0014"
  name: "14.Cluster 데몬 상태"
  command: "cmviewcl"
  os: "{{ vendor }}"
  inspection_criteria: [ 'offline', 'hard error', 'transport error' ]
  is_compare: true
  is_save: true
  timeout: 1
  sleep: 1
  message: "{{ message_data }}"

- rule_key: "shared_volume_status"
  cmd_id: "0015"
  name: "15.공유 볼륨 점검 상태"
  command: "scsimgr lun_map"
  os: "{{ vendor }}"
  inspection_criteria:
  - "FAILED"
  - "OFFLINE"
  - "ERROR"
  is_compare: true
  is_save: true
  timeout: 1
  sleep: 1
  message: "{{ message_data }}"

- rule_key: "network_link_status"
  cmd_id: "0016"
  name: "16.NW 링크 상태"
  command: "lanscan"
  os: "{{ vendor }}"
  inspection_criteria:
  # 점검 대상 LAN 인터페이스 이름을 exact match로 선언한다.
  # 목록이 비어 있으면 lanscan 데이터 라인을 전체 대상으로 본다.
  - "lan0"
  - "lan1"
  - "LinkAgg0"
  is_compare: true
  is_save: true
  timeout: 1
  sleep: 1
  message: "{{ message_data }}"

- rule_key: "nic_redundancy_status"
  cmd_id: "0017"
  name: "17.NIC 이중화 상태"
  command: "lanscan | awk '$1 ~ /^LinkAgg/ && $4 == \"UP\" { sub(/^lan/,\"\",$5); print $5 }' | xargs -n 1 lanadmin -g"
  os: "{{ vendor }}"
  inspection_criteria: ""
  is_compare: true
  is_save: true
  timeout: 1
  sleep: 1
  message: "{{ message_data }}"

- rule_key: "ping_loss_status"
  cmd_id: "0018"
  name: "18.PingLoss 상태"
  command: "ping $(netstat -rn | awk '$1==\"default\" {print $2}') -n5"
  os: "{{ vendor }}"
  inspection_criteria:
    max_loss: 0
    max_avg_rtt: 100
  is_compare: true
  is_save: true
  timeout: 25
  sleep: 1
  message: "{{ message_data }}"

- rule_key: "path_redundancy_status"
  cmd_id: "0019"
  name: "19.Path 이중화 상태"
  command: "scsimgr lun_map"
  os: "{{ vendor }}"
  inspection_criteria:
    min_paths: 2
    fail_state:
    - "DISCONNECTED"
    - "FAILED"
    - "OFFLINE"
  is_compare: true
  is_save: true
  timeout: 10
  sleep: 1
  message: "{{ message_data }}"

- rule_key: "hba_connection_status"
  cmd_id: "0020"
  name: "20.HBA 연결상태 점검"
  command: "ioscan -fnC fc | awk '$1==\"fc\" && $3 !~ /^=/ {print \"/dev/\" $4 $2}' | xargs -n 1 fcmsutil | egrep -i \"Driver State|Link Speed|Port Name\""
  os: "{{ vendor }}"
  inspection_criteria:
  - "ONLINE"
  - "LINK_UP"
  is_compare: true
  is_save: true
  timeout: 10
  sleep: 1
  message: "{{ message_data }}"
