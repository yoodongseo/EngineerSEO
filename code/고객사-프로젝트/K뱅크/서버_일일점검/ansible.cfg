[defaults]
collections_paths = /fap/ansible/ansible_collections
callback_plugins = /fap/ansible/plugins/callback
connection_plugins = /fap/ansible/plugins/connection
vars_plugins = /fap/ansible/plugins/vars
force_valid_group_names = ignore
inventory_plugins = /fap/ansible/plugins/inventory
host_key_checking = False
bin_ansible_callbacks = False
filter_plugins = /fap/ansible/plugins/filter
action_plugins = /fap/ansible/plugins/action
lookup_plugins = /fap/ansible/plugins/lookup
terminal_plugins = /fap/ansible/plugins/terminal
stdout_callback = yaml
strategy_plugins = /fap/ansible/plugins/strategy
deprecation_warnings = False
library = /fap/ansible/modules
test_plugins = /fap/ansible/plugins/test
display_skipped_hosts = False
roles_path = /fap/ansible/projects/faplib/roles
retry_files_enabled = False
inventory = /fap/ansible/inventory
cache_plugins = /fap/ansible/plugins/cache

[ssh_connection]
pipelining = True

