    com_value: "Fail"
    message: |
        설비 동작 상태 점검
        (FAN 상태)
    raw: "show environment fan"
    arr_num: 0
    grep: ""
    time: 1
    criteria: "Fail 결과 존재 시 비정상"
    id: 0006

  - cmd_name: "Power"
    cmd_command: 'show environment'
    value: "str"
