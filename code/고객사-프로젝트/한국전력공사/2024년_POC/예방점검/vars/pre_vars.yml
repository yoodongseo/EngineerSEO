      fail
      overtemp
      overload
      shutdown
    message: |
        설비 동작 상태 점검
        (Power 상태)
    raw: "show environment power"
    arr_num: 0
    grep: ""
    time: 1
    criteria: "Fail, Overtemp, Overload, Shutdown 결과 존재 시 비정상"
    id: 0007

