---
### Linux 대상 점검 명령어 수행 및 점검결과 변수처리
- name: "명령어 수행_python {{ item.message }}" ### Linux
  command: /usr/bin/python3 ../vars/raw.py
  environment:
    hostname: "{{ fap.host_ip }}"
    port: "{{ ansible_port }}"
    username: "{{ ansible_user }}"
    password: "{{ ansible_password }}"
    root_passwd: "{{ ansible_become_password | default('') }}"
    raw: "{{ item.raw }}"
    vendor: "{{ vendor }}"
    time: "2"
  register: total_item
  delegate_to: localhost
  
### python filter 를 통한 merged_value 생성 / 각 점검 주체 및 대상 항목 별 데이터 python 변수로 선언
- name: "{{ item.message }} tasks"
  command: /usr/bin/python3 ../vars/custom_filter.py
  environment:
    host: "{{ inventory_hostname }}" # 호스트명
    host_name: "{{ inventory_hostname }}" # 호스트명
    name: "{{ item.cmd_name }}" # 명령어 이름(UI 표시)
    command: "{{ item.cmd_command }}" # 사용되는 명령어
    report_type: "{{ report }}" # 점검 보고서 타입
    system: "{{ system }}" # 시스템_벤더_모델_설치사업소_설치장소_관리번호
    message: "{{ item.message }}" # 점검 메시지
    com_value: "{{ item.com_value }}" # 비교 기준 값
    value: "{{ item.value }}" # 필터링 케이스
    arr_num: "{{ item.arr_num }}" # 열 기준 구분 배열
    total_item: "{{ total_item.stdout }}" # 명령어 수행결과 stdout
    criteria: "{{ item.criteria }}" # 점검 기준 보고서 출력 메시지
    grep: "{{ item.grep | default('') }}" # 행 기준 비교 대상 라인
    unit: "{{ item.unit | default('') }}" # list_int 및 list_str 필터 단위 분리
    raw: "{{ item.raw }}"
  register: result_value
  delegate_to: localhost

### python을 통해 만들어진 merged_value 생성을 위한 데이터 파싱
- name: "{{ item.message }} Parse Json result"
  set_fact:
    merged: "{{ result_value.stdout | from_json }}"
  
- name: 점검 그룹 조회
  include_tasks: /fap/ansible/projects/COMPANY_시스템점검현황/tasks/host_info_make.yml

- name: 점검현황 데이터 입력 처리 -- "{{ report_table }}"
  include_tasks: /fap/ansible/projects/COMPANY_시스템점검현황/tasks/postgresql_make_query.yml

### 점검 항목 별 merged_value 생성
- name: merged_value 변수 설정 -- 작업성공
  set_fact:
    merged_value: "{{ merged_value + [merged] }}"