  - cmd_name: "version"
    cmd_command: 'show version'
    value: "version"
    com_value: "15.2"
    message: |
      Firmware_무결성 점검
    raw: "show version | include version"
    arr_num: 4
    grep: ""
    time: 3
    unit: 2
    criteria: |
      - 현 운영 Firmware Version 조회
      - 최신 Firmware Version Update 현황 조회

  - cmd_name: "CRC"
    cmd_command: 'show interface counters errors'
