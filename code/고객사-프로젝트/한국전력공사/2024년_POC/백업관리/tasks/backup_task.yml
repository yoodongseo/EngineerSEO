---
### Linux 대상 점검 명령어 수행 및 점검결과 변수처리
- name: "명령어 수행_python {{ item.message }}" ### Linux
  command: /usr/bin/python3 ../vars/raw.py
  environment:
    hostname: "{{ fap.host_ip }}"
    port: "{{ ansible_port }}"
    username: "{{ ansible_user }}"
    password: "{{ ansible_password }}"
    root_passwd: "{{ ansible_become_password | default('') }}"
    raw: "{{ item.raw }}"
    vendor: "{{ vendor }}"
    time: "{{ item.time }}"
  register: total_item
  delegate_to: localhost
  
- name: 성공 변수
  set_fact:
    merged_value: >-
      {{ [{
          'host': inventory_hostname,
          'id': item.arr_num,
          'name': item.message,
          'command': item.cmd_name,
          'result': total_item.stdout | default(None),
          'message': item.message | default(None),
          'is_success': true,
          'os': vendor | default(None),
          'compare': false
        }] + (merged_value | default([])) }}
  when: total_item.failed | default(true) == false

- name: 실패 변수
  set_fact:
    merged_value: >-
      {{ [{
          'host': inventory_hostname,
          'id': None,
          'name': None,
          'command': None,
          'result': None,
          'message': None,
          'is_success': False,
          'os': None,
          'compare': None
        }] + (merged_value | default([])) }}
  when: merged_value is not defined