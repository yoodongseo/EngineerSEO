linux_combined_command: |
  echo "===os_info==="
  echo "os_name=$(grep '^NAME=' /etc/os-release | cut -d= -f2 | tr -d '\"' | cut -d' ' -f1)"
  echo "os_version=$(grep '^PRETTY_NAME=' /etc/os-release | cut -d= -f2- | tr -d '\"' | awk '{print $1, $3}')"
  echo "kernel=$(uname -r)"
  echo "os_type=$(uname -s)"

  echo "===df_lines==="
  df -BM

  echo "===disk_size==="
  df | grep '^/dev/' | awk '{s+=$2} END {print s/1024}'

  echo "===uptime==="
  uptime

  echo "===cpu==="
  cat /proc/stat | grep cpu | tail -1 | awk '{print ($5*100)/($2+$3+$4+$5+$6+$7+$8+$9+$10)}' | awk '{print 100-$1}'

  echo "===cpu_cores==="
  nproc

  echo "===memory==="
  free | grep Mem | awk '{print ($3/$2)*100}'

  echo "===memory_size==="
  grep MemTotal /proc/meminfo | awk '{print int($2/1024)}'

  echo "===user_list==="
  grep /bin/bash /etc/passwd | cut -d: -f1 | egrep '^.{3,16}$'

  echo "===service_list==="
  systemctl list-units --type=service --all --no-legend --no-pager --plain | awk '{print $1}' | while read svc; do
    active=$(systemctl is-active "$svc" 2>/dev/null)
    if systemctl is-enabled "$svc" >/dev/null 2>&1; then
      enabled=$(systemctl is-enabled "$svc")
    else
      enabled="disabled"
    fi
    echo "{\"name\": \"$svc\", \"source\": \"systemd\", \"state\": \"$active\", \"status\": \"$enabled\"}"
  done

  echo "===package_list==="
  if command -v rpm >/dev/null 2>&1; then
    rpm -qa --qf '%{NAME} %{VERSION} %{RELEASE} %{EPOCH} %{ARCH}\n' | while read name version release epoch arch; do
      [ "$epoch" = "(none)" ] && epoch=null
      echo "{\"name\": \"$name\", \"version\": \"$version\", \"release\": \"$release\", \"epoch\": $epoch, \"arch\": \"$arch\", \"source\": \"rpm\"}"
    done
  elif command -v dpkg-query >/dev/null 2>&1; then
    dpkg-query -W -f='${Package} ${Version} ${Architecture}\n' | while read name version arch; do
      echo "{\"name\": \"$name\", \"version\": \"$version\", \"release\": \"-\", \"epoch\": null, \"arch\": \"$arch\", \"source\": \"dpkg\"}"
    done
  else
    echo "[]" 
  fi
