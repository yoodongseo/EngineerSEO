hpux_combined_command: |
  echo "===os_info==="
  echo "os_name=$(uname -s)"
  echo "os_version=$(uname -r)"
  echo "kernel=`uname -s` `uname -r` `uname -v`"
  echo "os_type=Unix"

  echo "===df_lines==="
  bdf

  echo "===disk_size==="
  bdf | awk 'NR>1 {s+=$2} END {print int(s/1024/1024)}'

  echo "===uptime==="
  uptime | awk '{print $1, $2, $3, $4}'

  echo "===cpu==="
  vmstat 1 5 | tail -n 5 | awk '{us+=$16; sy+=$17; count++} END {print (us+sy)/count}'

  echo "===cpu_cores==="
  ioscan -fnC processor | grep processor | wc -l

  echo "===memory==="
  swapinfo -tm | awk 'END {print 100 - $5}'

  echo "===memory_size==="
  swapinfo -tm | awk 'END {print $2}'

  echo "===user_list==="
  awk -F: '($7 ~ /(sh|bash|ksh|csh)$/ && length($1) >= 3 && length($1) <= 16) {print $1}' /etc/passwd

  echo "===service_list==="
  for dir in /sbin/init.d /etc/init.d; do
    if [ -d "$dir" ]; then
      for svc in "$dir"/*; do
        svc_name=$(basename "$svc")
        if ps -ef | grep -v grep | grep -w "$svc_name" > /dev/null; then
          state="running"
          running="true"
        else
          state="stopped"
          running="false"
        fi
        echo "{\"name\": \"$svc_name\", \"running\": \"$running\", \"state\": \"$state\", \"source\": \"initd\"}"
      done
    fi
  done

  echo "===package_list==="
  arch=$(uname -m)
  swlist -l product -a revision | awk 'NR > 4 && NF >= 2 {
    name = $1
    version = $2
    release = "-"
    epoch = "-"
    printf "{\"name\": \"%s\", \"version\": \"%s\", \"release\": \"%s\", \"epoch\": \"%s\", \"arch\": \"%s\", \"source\": \"swlist\"}\n", name, version, release, epoch, arch
    }'