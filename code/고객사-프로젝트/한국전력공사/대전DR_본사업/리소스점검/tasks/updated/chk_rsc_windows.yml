- name: Windows 명령어 실행(스크립트 방식)
  win_shell: "{{ windows_combined_command }}"
  register: combined_result

# - name: 디버깅
#   debug:
#     var: combined_result

- name: merged_value 
  set_fact:
    merged_value: >-
      {{
        (combined_result.stdout_lines
        | parse_sectioned_output
        | parse_combined_result('windows'))
      }}