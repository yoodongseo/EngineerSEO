---
- name: 01. LINUX - OS 정보 수집
  raw: |
    echo "os_name=$(grep '^NAME=' /etc/os-release | cut -d= -f2 | tr -d '"' | cut -d' ' -f1)"
    echo "os_version=$(grep '^PRETTY_NAME=' /etc/os-release | cut -d= -f2- | tr -d '"' | awk '{print $1, $3}')"
    echo "kernel=$(uname -r)"
    echo "os_type=$(uname -s)"
  register: os_info

- name: 디버깅
  debug:
    var: os_info.stdout_lines

- name: 01. LINUX - OS 정보 (로케일 경고 제거)
  set_fact:
    os_lines_clean: "{{ os_info.stdout_lines | remove_locale_warnings }}"

- name: 디버깅
  debug:
    var: os_lines_clean

- name: 01. LINUX - OS 정보 --> merged_value
  set_fact:
    merged_value: >-
      {{
        merged_value | default({}) | combine({
          'os_name': os_lines_clean[0].split('=')[1] | default(''),
          'os_version': os_lines_clean[1].split('=')[1] | default(''),
          'kernel': os_lines_clean[2].split('=')[1] | default(''),
          'os_type': os_lines_clean[3].split('=')[1] | default('')
        })
      }}
      
- name: 02. LINUX - Disk 정보
  raw: df -BM
  register: disk_info

- name: 02. LINUX - df_list 생성 (필터 방식)
  set_fact:
    df_list: "{{ disk_info.stdout_lines | remove_locale_warnings | parse_df_lines }}"

- name: 02. LINUX - Disk 정보 --> merged_value
  set_fact:
    merged_value: "{{ merged_value | combine({'disk_list': df_list}) }}"

- name: 03. LINUX - Disk 사이즈 계산(GB)
  raw: "df | grep '^/dev/' | awk '{s+=$2} END {print s/1024/1024}'"
  register: disk_size

- name: 03. LINUX - Disk 사이즈 --> merged_value
  set_fact:
    merged_value: "{{ merged_value | combine({'disk_size': disk_size.stdout_lines[-1]}) }}"

- name: 04. LINUX - Uptime
  raw: "uptime"
  register: uptime_info

- name: 04. LINUX - Uptime (로케일 제거)
  set_fact:
    uptime_line: "{{ uptime_info.stdout_lines | remove_locale_warnings | first | default('') }}"

- name: 04. LINUX - Uptime 정제
  set_fact:
    uptime_trimmed: "{{ uptime_line | regex_search('^.*?up\\s+[^,]+,') | regex_replace(',$', '')| trim }}"

- name: 04. LINUX - Uptime --> merged_value
  set_fact:
    merged_value: "{{ merged_value | default({}) | combine({'uptime': uptime_trimmed}) }}"

- name: 05. LINUX - CPU 사용량 
  raw: cat /proc/stat |grep cpu |tail -1|awk '{print ($5*100)/($2+$3+$4+$5+$6+$7+$8+$9+$10)}'|awk '{print 100-$1}'
  register: cpu_info

- name: 05. LINUX - CPU 사용량 --> merged_value
  set_fact:
    merged_value: "{{ merged_value | combine({'cpu': cpu_info.stdout_lines | remove_locale_warnings | last }) }}"

- name: 06. LINUX - CPU 코어
  raw: nproc
  register: raw_core_count

- name: 06. LINUX - CPU 코어 (로케일 제거)
  set_fact:
    core_count: "{{ raw_core_count.stdout_lines | remove_locale_warnings | first | default('') }}"

- name: 06. LINUX - CPU 코어 --> merged_value
  set_fact:
    merged_value: "{{ merged_value | combine({'cpu_cores': core_count | default('') }) }}"

- name: 07. LINUX - Memory 사용률
  raw: free | grep Mem | awk '{print ($3/$2)*100}'
  register: raw_memory_usage

- name: 07. LINUX - Memory 사용률 (로케일 제거)
  set_fact:
    memory_usage: "{{ raw_memory_usage.stdout_lines | remove_locale_warnings | first | default('') }}"

- name: 07. LINUX - Memory 사용률 --> merged_value
  set_fact:
    merged_value: "{{ merged_value | combine({'memory': memory_usage | default('') }) }}"

- name: 08. LINUX - Memory 총량 (MB)
  raw: grep MemTotal /proc/meminfo | awk '{print int($2/1024)}'
  register: raw_memory_size

- name: 08. LINUX - Memory 사용률 (로케일 제거)
  set_fact:
    memory_size: "{{ raw_memory_size.stdout_lines | remove_locale_warnings | first | default('') }}"

- name: 08. LINUX - Memory 총량 (MB) --> merged_value
  set_fact:
    merged_value: "{{ merged_value | combine({'memory_size': memory_size | default('') }) }}"

- name: 09. LINUX - User List 수집
  raw: "grep /bin/bash /etc/passwd | cut -d: -f1 | egrep '^.{3,16}$'"
  register: user_list

- name: 09. LINUX - User List --> merged
  set_fact:
    merged_value: "{{ merged_value | combine({'user_list': user_list.stdout_lines | remove_locale_warnings }) }}"

- name: 10. LINUX - Service List 수집 (JSON format 처리)
  raw: |
    systemctl list-units --type=service --all --no-legend --no-pager --plain | awk '{print $1}' | while read svc; do
      active=$(systemctl is-active "$svc" 2>/dev/null)

      if systemctl is-enabled "$svc" >/dev/null 2>&1; then
        enabled=$(systemctl is-enabled "$svc")
      else
        enabled="disabled"
      fi

      echo "{\"name\": \"$svc\", \"source\": \"systemd\", \"state\": \"$active\", \"status\": \"$enabled\"}"
    done
  register: raw_service_list

- name: 10. LINUX - Service List (리스트 필터 적용)
  set_fact:
    merged_value: >-
      {{
        merged_value | default({}) | combine({
          'service_list': raw_service_list.stdout_lines | extract_json_lines
        })
      }}

- name: 11. LINUX - Package List 수집 (rpm / dpkg 분기)
  raw: |
    if command -v rpm >/dev/null 2>&1; then
      rpm -qa --qf '%{NAME} %{VERSION} %{RELEASE} %{EPOCH} %{ARCH}\n' | while read name version release epoch arch; do
        [ "$epoch" = "(none)" ] && epoch=null
        echo "{\"name\": \"$name\", \"version\": \"$version\", \"release\": \"$release\", \"epoch\": $epoch, \"arch\": \"$arch\", \"source\": \"rpm\"}"
      done
    elif command -v dpkg-query >/dev/null 2>&1; then
      dpkg-query -W -f='${Package} ${Version} ${Architecture}\n' | while read name version arch; do
        echo "{\"name\": \"$name\", \"version\": \"$version\", \"release\": \"-\", \"epoch\": null, \"arch\": \"$arch\", \"source\": \"dpkg\"}"
      done
    else
      echo "[]" 
    fi
  register: raw_package_list

- name: 11. LINUX - Package List 파싱 (리스트 필터 적용)
  set_fact:
    parsed_package_list: "{{ raw_package_list.stdout_lines | extract_json_lines }}"
      
- name: 11. LINUX - Package List (dpkg 버전 파싱)
  set_fact:
    parsed_package_list: "{{ parsed_package_list | dpkg_parse_version }}"
  when: >
    parsed_package_list is defined and
    parsed_package_list | length > 0 and
    parsed_package_list[0].source == 'dpkg'

- name: 11. LINUX - Package List --> merged_value
  set_fact:
    merged_value: "{{ merged_value | combine({'package_list': parsed_package_list }) }}"