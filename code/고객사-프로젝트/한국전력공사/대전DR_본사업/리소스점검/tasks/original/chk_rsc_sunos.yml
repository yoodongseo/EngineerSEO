---
- name: 01. SunOS - OS 정보 수집
  raw: |
    echo "os_name=`uname -s`"
    echo "os_version=`head -n 1 /etc/release | awk '{print $1, $2, $3, $4}'`"
    echo "kernel=SunOS `uname -r` `uname -v`"
    echo "os_type=Unix"
  register: os_info

- name: 01. SunOS - OS 정보 (로케일 경고 제거)
  set_fact:
    os_lines_clean: "{{ os_info.stdout_lines | remove_locale_warnings }}"

- name: 01. SunOS - OS 정보 --> merged_value
  set_fact:
    merged_value: >-
      {{
        merged_value | default({}) | combine({
          'os_name': os_lines_clean[0].split('=')[1] | default(''),
          'os_version': os_lines_clean[1].split('=')[1] | default(''),
          'kernel': os_lines_clean[2].split('=')[1] | default(''),
          'os_type': os_lines_clean[3].split('=')[1] | default('')
        })
      }}

- name: 02. SunOS - Disk 정보
  raw: |
    df -k | awk 'NR==1 {print; next}
    NF<6 { getline nextline; $0=$0" "nextline }
    { print }'
  register: disk_info

- name: 02. SunOS - df_list 생성 (필터 방식)
  set_fact:
    df_list: "{{ disk_info.stdout_lines | remove_locale_warnings | parse_df_lines('KB') }}"

- name: 02. SunOS - Disk 정보 --> merged_value
  set_fact:
    merged_value: "{{ merged_value | combine({'disk_list': df_list}) }}"

