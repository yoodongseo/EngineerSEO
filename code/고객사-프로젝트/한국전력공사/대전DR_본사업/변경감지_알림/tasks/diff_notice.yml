---
- name: 수집 결과 파싱
  set_fact:
    current_data: >-
      {{
        current_data | default({}) |
        combine({
          fap.host_ip: {
            'cmd_id': item.item.id,
            'cmd_name': item.item.name,
            'cmd': item.item.command,
            'output': item.stdout
          }
        })
      }}
  
- name: 1. DB 저장된 이전 데이터와 비교 (diff)
  fap.common.diff_data:
    fap_vars: "{{ fap }}"
    table_name: "ansible_cli_data"
    key_columns:
      - { column: "host_name", value: "{{ fap.host_ip }}" }
      - { column: "data_type", value: "backup" }
      - { column: "data_key", value: "kepco" }
      - { column: "cmd_id", value: "{{ current_data[fap.host_ip].cmd_id }}" }
    target_column: "output"
    content: "{{ current_data[fap.host_ip].output | default('') }}"   # 현재 수집한 데이터
  when: fap.host_ip in current_data
  register: diff_data
  delegate_to: localhost
  
- name: diff_data debug
  debug:
    msg: "{{ diff_data }}"
  
#### 기존 alarm_content ###
      # ---------------------------------
      # ■ 대상 장비: {{ fap.host_name }}({{ fap.host_ip }})
      # ■ 실행 명령어: {{ current_data[fap.host_ip].cmd }}
      # ■ 변경 데이터: {{ diff_data.data.diff_text }}
############################
        
# 2. 개별 알림 Content 생성
- name: 2. 개별 알림 Content 생성
  set_fact:
    result_value: "{{ result_value | default([]) + [result_item] }}"
  vars:
    alarm_content: |-
      <table width="100%" cellspacing="0" cellpadding="0" border="1" style="border=color:#d9d9d9;"">
        <tr><td width="70px">실행일시</td><td>{{ diff_data.data.time }}</td></tr>
        <tr><td >실행내용</td><td>{{ fap.template_info.template_name }}</td></tr>
        <tr><td >대상장비</td><td>{{ fap.host_name }}({{ fap.host_ip }})</td></tr>
        <tr><td >발생명령어</td><td>{{ current_data[fap.host_ip].cmd }}</td></tr>
        <tr><td >변경구분</td><td>{{ diff_data.data.summary_message }}</td></tr>
        <tr><td >세부내용</td><td>{{ diff_data.data.diff_text | regex_replace('\r?\n', '<BR/>' }}</td></tr>
      </table><br/>
    result_item:
      host: "{{ fap.host_ip }}"
      host_name: "{{ fap.host_name }}"
      output: "{{ diff_data.data | to_json }}"
      message: "{{ alarm_content }}"
  when: diff_data is defined and (diff_data.data.is_changed | default(false))
  delegate_to: localhost

# 3. 데이터 Merge 위해 DB에 저장
- name: 3. 데이터 Merge 위해 DB에 저장
  fap.common.save_data:
    fap_vars: "{{ fap }}" 
    hostname: "{{ fap.host_name }}"
    table_name: ansible_cli_data
    data_type: "ALARM_DATA"
    data_key: "MERGE_DIFF_DATA"
    content: "{{ content_value | default({}) | combine({'data_list': result_value}) }}"
    template_id: "{{ fap.template_id | default(omit) }}"
    job_id: "{{ fap.job_id | default(omit) }}"
  when: diff_data is defined and (diff_data.data.is_changed | default(false))
  delegate_to: localhost
