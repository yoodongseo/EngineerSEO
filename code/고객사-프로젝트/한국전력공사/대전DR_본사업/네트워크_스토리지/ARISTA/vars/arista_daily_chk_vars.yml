---
report_type: 'preventive'
data_key: 'kepco'
today: "{{ lookup('pipe', 'date +%Y%m%d') }}"
save_today: "{{ lookup('pipe', 'date +%y-%m%d-%H%M') }}"
message_data: "{{ report_type }}_{{ save_today }}"
file_path: "/fap/report/{{ data_key }}/{{ today }}/{{ fap.job_ip }}/{{ fap.host_ip }}"
data_type: "report" # content save backup 외 report, backup
save_type: "report" # report, path, backup
system: "network"
model: "arista"
data5: "에방점검_Arista"

commands:
  - cmd_id: "0001"
    filter_key: "AristaCPUFilter"
    name: "01. CPU 점검"
    command: "show processes top once"
    os: "{{ model }}"
    inspection_criteria:
      five_seconds_avg: 80
      one_minute_avg: 15
      five_minutes_avg: 10
      process: 80
    is_save: true
    is_compare: true
    timeout: 1
    sleep: 1
    message: "{{ message_data }}"
  - {
      cmd_id: "0002",
      filter_key: "AristaMemoryFilter",
      name: "02. 메모리 점검",
      command: "show processes top memory once",
      os: "{{ model }}",
      inspection_criteria: 20,
      is_save: true,
      is_compare: true,
      timeout: 1,
      sleep: 1,
      message: "{{ message_data }}"
    }
  - cmd_id: "0003"
    filter_key: "AristaInterfaceFilter"
    name: "03. 인터페이스 점검"
    command: "show interface"
    os: "{{ model }}"
    inspection_criteria:
      tx_thresh: 0.001
      rx_thresh: 0.1
    is_save: true
    is_compare: true
    timeout: 1
    sleep: 1
    message: "{{ message_data }}"
  - {
      cmd_id: "0004",
      filter_key: "AristaInterfaceStatusFilter",
      name: "04. 인터페이스/모듈 상태 점검",
      command: "show interface status",
      os: "{{ model }}",
      inspection_criteria: "",
      is_save: true,
      is_compare: true,
      timeout: 1,
      sleep: 1,
      message: "{{ message_data }}"
    }
  - cmd_id: "0005"
    filter_key: "NetworkVlanFilter"
    name: "05. VLAN 상태 점검"
    command: "show vlan brief"
    os: "{{ model }}"
    inspection_criteria:
      ok_statuses: ["active", "act/unsup", "inactive"]
    is_save: true
    is_compare: true
    timeout: 1
    sleep: 1
    message: "{{ message_data }}"
    
  - cmd_id: "0006"
    filter_key: "NetworkMacFilter"
    name: "06. Mac/Arp 점검"
    command: "show mac address-table"
    os: "{{ model }}"
    inspection_criteria:
      allow_arp_duplicate_ip: false
      require_arp_mapping: false
    is_save: true
    is_compare: true
    timeout: 1
    sleep: 1
    message: "{{ message_data }}"

  - cmd_id: "0007"
    filter_key: "NetworkRouteFilter"
    name: "7. Router 점검"
    command: "show ip route"
    os: "{{ model }}"
    inspection_criteria:
      require_default_route: true
      require_codes: ["S", "C"]   # 필요 시 ["S","O","B"]
    is_save: true
    is_compare: true
    timeout: 1
    sleep: 1
    message: "{{ message_data }}"

  - {
      cmd_id: "0008",
      filter_key: "CiscoSTPFilter",
      name: "09. STP상태 점검",
      command: "show spanning-tree",
      os: "{{ model }}",
      inspection_criteria: "",
      is_save: true,
      is_compare: true,
      timeout: 1,
      sleep: 1,
      message: "{{ message_data }}"
    }
  - cmd_id: "0009"
    filter_key: "AristaRedundancyFilter"
    name: "09. 이중화 상태 점검"
    command: "show vrrp brief"
    os: "{{ model }}"
    inspection_criteria: "error"
    is_save: true
    is_compare: true
    timeout: 1
    sleep: 1
    message: "{{ message_data }}"
  - {
      cmd_id: "0010",
      filter_key: "messages",
      name: "10. Ping 점검",
      command: "ping {{ ping_ip }}",
      os: "{{ model }}",
      inspection_criteria: "100% packet loss",
      is_save: true,
      is_compare: true,
      timeout: 5,
      sleep: 1,
      message: "{{ message_data }}"
    }
  - {
      cmd_id: "0011",
      filter_key: "LogFilter",
      name: "11. Log 점검",
      command: "show logging 50",
      os: "{{ model }}",
      inspection_criteria: "error,down",
      is_save: true,
      is_compare: true,
      timeout: 1,
      sleep: 1,
      message: "{{ message_data }}"
    }
  - {
      cmd_id: "0012",
      filter_key: "AristaPowerFilter",
      name: "12. 전원 점검",
      command: "show environment power",
      os: "{{ model }}",
      inspection_criteria: "ok",
      is_save: true,
      is_compare: true,
      timeout: 1,
      sleep: 1,
      message: "{{ message_data }}"
    }
  - cmd_id: "0013"
    filter_key: "AristaFanFilter"
    name: "13. FAN, 온도 점검"
    command: "show system environment cooling"
    os: "{{ model }}"
    inspection_criteria:
      ok_status: "ok"
      stable_value: "stable"
      temp_min: 20
      temp_max: 40
    is_save: true
    is_compare: true
    timeout: 1
    sleep: 1
    message: "{{ message_data }}"
