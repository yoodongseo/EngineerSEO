---
- name: daily_chk_play
  hosts: all
  gather_facts: false
  ignore_errors: true
  strategy: free
  ignore_unreachable: true
  
  pre_tasks:
    - name: 변수 호출
      include_vars: ../vars/sdn_sol_daily_chk_vars.yml
        
  module_defaults: # ansible module 호출 시, 사용되는 파라미터값의 기본값 설정(단위 작업마다 해당 파라미터를 사용하면 가시성>이 떨어지므로 가시성 확보를 위함)
    fap.common.exec_command_custom: # fap.common.exce_command_custom module 호출
      fap_vars: "{{ fap }}" # fap 변수
      protocol: auto # 작업 대상에 접속하기위한 프로토콜 정의 ---> 선택: auto(default)|telnet|ssh
      ip: "{{ inventory_hostname }}" # 작업 대상의 IP 주소
      ssh_port: "{{ ansible_port | default(22) }}" # SSH 접속 시 사용할 포트 번호
      result_type: cli_data # 해당 모듈 수행 결과의 return type 정의 ---> 선택: list|dict|cli_data
      user_id: "{{ ansible_user }}" # 작업대상 접속에 필요한 username
      user_password: "{{ ansible_password | default('') }}" # 작업대상 접속에 필요한 password
      become_method: "{{ ansible_become_method | default('') }}" # 작업대상 접속의 권한상승 명령어(필요 시)
      become_password: "{{ ansible_become_password | default('') }}" #작업 대상 접속의 권한상승 비밀번호(필요 시)
      network_os: "veritas" #작업 대상에 로그인을 하기위한 구분자 정보

  tasks:
    - block:
      - name: 명령어 실행
        fap.common.exec_command_custom:
          command: "{{ commands }}" # {{ model }}.yml 파일에 정의된 명령어를 호출 한다.
        register: prompt_result # ansible module의 결과값을 result 변수에 저장 한다.
        delegate_to: localhost # 작업 수행을 localhost에서 수행한다. (필수)
        
      - name: 명령어 결과 필터 처리
        filter_exec_module:
          stdout_lines: "{{ prompt_result.result.data_list | map(attribute='output') | list }}"
          inspection_items: "{{ commands | selectattr('is_save','eq',true) }}"
          host: "{{ inventory_hostname }}"
          host_name: "{{ inventory_hostname }}"
          report_type: "{{ report_type }}"
          system: "{{ system }}"
          file_path: ""
          data5: "{{ data5 }}"
        register: result_value
        delegate_to: localhost
        
      always:
        - name: db 저장 task 호출
          include_tasks: /fap/ansible/projects/faplib/tasks/save_db.yml
