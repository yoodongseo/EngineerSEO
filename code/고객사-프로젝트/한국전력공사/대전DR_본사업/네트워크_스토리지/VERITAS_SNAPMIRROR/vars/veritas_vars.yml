---
# report_type: 'replicationstatus'
report_type: 'preventive'
data_key: 'kepco'
today: "{{ lookup('pipe', 'date +%Y%m%d') }}"
save_today: "{{ lookup('pipe', 'date +%y-%m%d-%H%M') }}"
message_data: "{{ report_type }}_{{ save_today }}"
file_path: "/fap/report/{{ data_key }}/{{ today }}/{{ fap.job_ip }}/{{ fap.host_ip }}"
data_type: "report" # content save backup 외 report, backup
save_type: "report" # report, path, backup
system: "storage"
model: "veritas"
data5: "에방점검_Veritas"

commands:
############## Veritas 사전 접속 명령어 ##############
  - command: "Support"
    is_save: False
    is_compare: true
    timeout: 3
    sleep: 2
    message: "{{ message_data }}"
    os: "{{ model }}"

  - command: "Maintenance"
    is_save: False
    is_compare: true
    timeout: 3
    sleep: 2
    os: "{{ model }}"
    message: "{{ message_data }}"
    expect:
    - prompt: ':'
      answer: "{{ ansible_password }}"

  - command: "su"
    is_save: False
    is_compare: true
    timeout: 3
    sleep: 2
    os: "{{ model }}"
    message: "{{ message_data }}"
    expect:
    - prompt: ':'
      answer: "{{ ansible_password }}"
############## Veritas 사전 접속 명령어 ##############
  - {
      cmd_id: "0001",
      filter_key: "VeritasRedundancyFilter",
      name: "01. Path 이중화 상태 점검",
      command: "bpdbjobs | head -100",
      os: "{{ model }}",
      inspection_criteria: "",
      is_save: true,
      is_compare: true,
      timeout: 3,
      sleep: 1,
      message: "{{ message_data }}"
    }
############## Veritas 프롬프트 복구 ##############
  - command: "exit"
    is_save: False
    is_compare: true
    timeout: 1
    sleep: 1
    message: "{{ message_data }}"
    os: "{{ model }}"

  - command: "exit"
    is_save: False
    is_compare: true
    timeout: 1
    sleep: 1
    message: "{{ message_data }}"
    os: "{{ model }}"

  - command: "logs"
    is_save: False
    is_compare: true
    timeout: 1
    sleep: 1
    message: "{{ message_data }}"
    os: "{{ model }}"
############## Veritas 프롬프트 복구 ##############
  - {
      cmd_id: "0002",
      filter_key: "LogFilter",
      name: "02. 로그 점검",
      command: "VxLogView Minutes 60",
      os: "{{ model }}",
      inspection_criteria: "Info",
      is_save: true,
      is_compare: true,
      timeout: 1,
      sleep: 1,
      message: "{{ message_data }}",
    }
############## Veritas 프롬프트 복구 ##############
  - command: "Return"
    is_save: False
    is_compare: true
    timeout: 1
    sleep: 1
    message: "{{ message_data }}"
    os: "{{ model }}"
############## Veritas 프롬프트 복구 ##############

################## 디스크 점검 ################## 
  - {
      cmd_id: "0003",
      filter_key: "disk",
      name: "03. 물리적 상태 점검 - 디스크",
      command: "Disk Info",
      os: "{{ model }}",
      inspection_criteria: 80,
      is_save: true,
      is_compare: true,
      timeout: 3,
      sleep: 1,
      message: "{{ message_data }}"
    }
################## 디스크 점검 ################## 
  - command: "Maintenance"
    is_save: False
    is_compare: true
    timeout: 3
    sleep: 2
    os: "{{ model }}"
    message: "{{ message_data }}"
    expect:
    - prompt: ':'
      answer: "{{ ansible_password }}"

  - command: "su"
    is_save: False
    is_compare: true
    timeout: 3
    sleep: 2
    os: "{{ model }}"
    message: "{{ message_data }}"
    expect:
    - prompt: ':'
      answer: "{{ ansible_password }}"
############## Veritas 사전 접속 명령어 ##############
  - cmd_id: "0004"
    filter_key: "VeritasTapeFilter"
    name: "04. 물리적 상태 점검 - Tape Drive 상태"
    command: "tpconfig -l"
    os: "{{ model }}"
    inspection_criteria:
      min_drive_count: 1
    is_save: true
    is_compare: true
    timeout: 3
    sleep: 1
    message: "{{ message_data }}"

  - cmd_id: "0005"
    filter_key: "VeritasVolFilter"
    name: "05. 용량 점검 - 백업 수행 용량 점검"
    command: "nbdevquery -listdp -U"
    os: "{{ model }}"
    inspection_criteria:
      storage_server: ""
      expected_pools: []
    is_save: true
    is_compare: true
    timeout: 3
    sleep: 1
    message: "{{ message_data }}"
    
  - cmd_id: "0006"
    filter_key: "VeritasSWFilter"
    name: "06. SW 상태점검 - 백업 Pross, Client 연결상태 점검"
    command: "bpclntcmd -pn"
    os: "{{ model }}"
    inspection_criteria:
      - "cannot connect to server"
      - "connection timeout"
      - "host not found"
      - "handshake"
    is_save: true
    is_compare: true
    timeout: 3
    sleep: 1
    message: "{{ message_data }}"
