system: "{{ vendor }}_2_3_4_5_6"

inspection_commands:
- rule_key: "cpu_usage"
  cmd_id: "0001"
  name: "01.CPU 점검"
  command: >
    powershell.exe -NoProfile -Command "$paths = @('\Processor(_Total)\% User Time', '\Processor(_Total)\% Privileged Time','\Processor(_Total)\% Idle Time', '\Processor(_Total)\% Interrupt Time'); $data = Get-Counter -Counter $paths -SampleInterval 1 -MaxSamples 3; $data.CounterSamples | Group-Object Path | ForEach-Object { $avg = ($_.Group | Measure-Object -Property CookedValue -Average).Average; $counter = [regex]::Match($_.Name, '% .*time$', 'IgnoreCase').Value.ToLower(); switch ($counter) { '% user time' { $name = 'User' } '% privileged time' { $name = 'Privileged' } '% idle time' { $name = 'Idle' } '% interrupt time' { $name = 'Interrupt' } default { $name = $_.Name } }; '{0}={1:N2}' -f $name, $avg }"
  os: "{{ vendor }}"
  inspection_criteria:
    max_user_sys_pct: 80
    min_idle_pct: 20
    max_irq_pct: 5
  is_compare: true
  is_save: true
  timeout: 60
  sleep: 0.2
  message: "{{ message_data }}"

- rule_key: "cpu_core"
  cmd_id: "0002"
  name: "02.CPU 코어별 상태 점검"
  command: "wmic path Win32_Processor get DeviceID,Status,Availability,CpuStatus,NumberOfCores,NumberOfLogicalProcessors /value"
  os: "{{ vendor }}"
  inspection_criteria:
    status_ok: "OK"
    availability_ok: 3
    cpu_status_ok: 1
  is_compare: true
  is_save: true
  timeout: 30
  sleep: 0.2
  message: "{{ message_data }}"

- rule_key: "memory_usage"
  cmd_id: "0003"
  name: "03.Memory 사용률"
  command: "wmic OS get FreePhysicalMemory,TotalVisibleMemorySize /value"
  os: "{{ vendor }}"
  inspection_criteria:
    max_used_mem: 80
    min_free_mem_pct: 20
  is_compare: true
  is_save: true
  timeout: 10
  sleep: 0.2
  message: "{{ message_data }}"

- rule_key: "memory_scan"
  cmd_id: "0004"
  name: "04.Memory 상태 확인"
  command: "wmic memorychip get BankLabel,Capacity,ConfiguredClockSpeed,Speed,Status /value"
  os: "{{ vendor }}"
  inspection_criteria: ""
  is_compare: true
  is_save: true
  timeout: 10
  sleep: 0.2
  message: "{{ message_data }}"

- rule_key: "paging_space"
  cmd_id: "0005"
  name: "05.Paging Space"
  command: "wmic pagefile get AllocatedBaseSize,CurrentUsage,PeakUsage /value"
  os: "{{ vendor }}"
  inspection_criteria:
    max_used_swap: 50
  is_compare: true
  is_save: true
  timeout: 10
  sleep: 0.2
  message: "{{ message_data }}"

- rule_key: "filesystem_usage"
  cmd_id: "0006"
  name: "06.파일시스템 사용량"
  command: 'wmic LogicalDisk where "DriveType=3" get DeviceID,Size,FreeSpace /value'
  os: "{{ vendor }}"
  inspection_criteria: 80
  is_compare: true
  is_save: true
  timeout: 10
  sleep: 0.2
  message: "{{ message_data }}"

- rule_key: "disk_swap_usage"
  cmd_id: "0007"
  name: "07.Disk Swap 사용률"
  command: "wmic pagefile get Name,AllocatedBaseSize,CurrentUsage,PeakUsage /value"
  os: "{{ vendor }}"
  inspection_criteria:
    max_used_swap: 50
  is_compare: true
  is_save: true
  timeout: 10
  sleep: 0.2
  message: "{{ message_data }}"

- rule_key: "disk_redundancy"
  cmd_id: "0008"
  name: "08.DISK 이중화 정상 여부"
  command: >
    powershell.exe -NoProfile -Command "$cmd = Get-Command Get-VirtualDisk -ErrorAction SilentlyContinue; if (-not $cmd) { 'NOT_APPLICABLE=Get-VirtualDisk unavailable'; exit 0 }; try { $vds = Get-VirtualDisk -ErrorAction Stop } catch { 'Access is denied'; exit 0 }; if (-not $vds) { 'NOT_APPLICABLE=No virtual disk'; exit 0 }; foreach ($vd in $vds) {
      'Name=' + $vd.FriendlyName;
      'Resiliency=' + $vd.ResiliencySettingName;
      'HealthStatus=' + $vd.HealthStatus;
      'OperationalStatus=' + (($vd.OperationalStatus -join ','));
      ''
    }"
  os: "{{ vendor }}"
  inspection_criteria: ""
  is_compare: true
  is_save: true
  timeout: 10
  sleep: 0.2
  message: "{{ message_data }}"

- rule_key: "dev_stat"
  cmd_id: "0009"
  name: "09.DISK 인식 여부 점검"
  # 원래의 PowerShell 로직을 한 줄로 감싸 실행 가능하게 변경
  command: "powershell -Command \"Get-Disk | Select-Object Number, FriendlyName, Size, OperationalStatus, HealthStatus, BusType, PartitionStyle | ForEach-Object { 'Number=' + $_.Number; 'FriendlyName=' + $_.FriendlyName; 'Size=' + $_.Size; 'OperationalStatus=' + $_.OperationalStatus; 'HealthStatus=' + $_.HealthStatus; 'BusType=' + $_.BusType; 'PartitionStyle=' + $_.PartitionStyle; '' }\""
  os: "{{ vendor }}"
  inspection_criteria: "Offline,Failed"
  is_compare: true
  is_save: true
  timeout: 10
  sleep: 1
  message: "{{ message_data }}"

- rule_key: "disk_stat"
  cmd_id: "0010"
  name: "10.DISK I/O 점검"
  command: "powershell -Command \"$p = (Get-Counter -ListSet 'PhysicalDisk').Paths | Where-Object { $_ -like '*Avg. Disk sec/Read' -or $_ -like '*Avg. Disk sec/Write' }; Get-Counter -Counter $p -SampleInterval 1 -MaxSamples 1 | Select-Object -ExpandProperty CounterSamples | Where-Object { $_.Path -like '*(_total)*' } | Select-Object @{Name='Metric'; Expression={if($_.Path -like '*read*') {'Read Latency'} else {'Write Latency'}}}, @{Name='Latency(ms)'; Expression={[Math]::Round($_.CookedValue * 1000, 3)}}\""
  os: "{{ vendor }}"
  inspection_criteria: 20
  is_compare: true
  is_save: true
  timeout: 5
  sleep: 1
  message: "{{ message_data }}"

- rule_key: "inode_usage"
  cmd_id: "0011"
  name: "11.DISK I-Node 정상여부"
  command: "powershell -Command \"Get-Volume | Where-Object DriveLetter | ForEach-Object { fsutil dirty query ($_.DriveLetter + ':') }\""
  os: "{{ vendor }}"
  inspection_criteria: "is Dirty"
  is_compare: true
  is_save: true
  timeout: 5
  sleep: 1
  message: "{{ message_data }}"

- rule_key: "kernel_parameter"
  cmd_id: "0012"
  name: "12.Kernel parameter Check"
  command: "powershell -Command \"netsh int tcp show global; netsh int ip show global; Get-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Services\\Tcpip\\Parameters'\""
  os: "{{ vendor }}"
  inspection_criteria: ""
  is_compare: true
  is_save: true
  timeout: 10
  sleep: 1
  message: "{{ message_data }}"

- rule_key: "system_log"
  cmd_id: "0013"
  name: "13.로그 점검"
  # 리눅스 tail처럼 한 줄씩 50개 출력
  command: "powershell -Command \"Get-EventLog -LogName System -Newest 50 | ForEach-Object { '{0} [{1}] ({2}) {3}' -f $_.TimeGenerated, $_.EntryType, $_.Source, $_.Message.Replace(\\\"`n\\\",' ').Trim().Substring(0, [Math]::Min($_.Message.Length, 80)) }\""
  os: "{{ vendor }}"
  inspection_criteria: "Error,Warning"
  is_compare: true
  is_save: true
  timeout: 5
  sleep: 1
  message: "{{ message_data }}"

- rule_key: "cluster_status"
  cmd_id: "0014"
  name: "14.Cluster 데몬 상태"
  command: "powershell -Command \"try { Get-Service clussvc -ErrorAction Stop | Out-Null; Write-Host '[Node Status]'; Get-ClusterNode | ForEach-Object { '{0} : {1}' -f $_.Name, $_.State }; Write-Host '---'; Write-Host '[Service Status]'; Get-ClusterResource | ForEach-Object { '{0} : {1}' -f $_.Name, $_.State } } catch { $_ | Out-String }\""
  os: "{{ vendor }}"
  inspection_criteria:
    ok_if_command_missing: true
    errormsg: "Down,Paused,Offline,Failed"
  is_compare: true
  is_save: true
  timeout: 1
  sleep: 1
  message: "{{ message_data }}"

- rule_key: "shared_volume_status"
  cmd_id: "0015"
  name: "15.공유 볼륨 점검 상태"
  command: >
    powershell.exe -NoProfile -Command "$cmd = Get-Command Get-ClusterSharedVolume -ErrorAction SilentlyContinue; if (-not $cmd) { 'NOT_APPLICABLE=Get-ClusterSharedVolume unavailable'; exit 0 }; $csvs = Get-ClusterSharedVolume; if (-not $csvs) { 'NOT_APPLICABLE=No cluster shared volume'; exit 0 }; foreach ($csv in $csvs) { 'Name=' + $csv.Name; 'State=' + $csv.State; 'Path=' + $csv.SharedVolumeInfo.FriendlyVolumeName; '' }"
  os: "{{ vendor }}"
  inspection_criteria: ""
  is_compare: true
  is_save: true
  timeout: 20
  sleep: 0.2
  message: "{{ message_data }}"

- rule_key: "network_link_status"
  cmd_id: "0016"
  name: "16.NW 링크 상태"
  command: 'wmic nic where "PhysicalAdapter=True" get Name,NetConnectionID,NetConnectionStatus,NetEnabled,Speed,AdapterType,PhysicalAdapter /format:list'
  os: "{{ vendor }}"
  inspection_criteria:
    # 물리 NIC가 UP 상태이고, Speed가 min_speed_mbps 이상이면 정상으로 본다.
    min_speed_mbps: 1
  is_compare: true
  is_save: true
  timeout: 15
  sleep: 0.2
  message: "{{ message_data }}"

- rule_key: "nic_redundancy_status"
  cmd_id: "0017"
  name: "17.NIC 이중화 상태"
  command: >
    powershell.exe -NoProfile -Command "$teamCmd = Get-Command Get-NetLbfoTeam -ErrorAction SilentlyContinue; $memberCmd = Get-Command Get-NetLbfoTeamMember -ErrorAction SilentlyContinue; if (-not $teamCmd -or -not $memberCmd) { 'NOT_APPLICABLE=NIC Teaming cmdlets unavailable'; exit 0 }; $teams = Get-NetLbfoTeam; if (-not $teams) { 'NOT_APPLICABLE=No NIC team'; exit 0 }; foreach ($team in $teams) { 'Name=' + $team.Name; 'Status=' + $team.Status; 'Mode=' + $team.TeamingMode; 'Members=' + ((Get-NetLbfoTeamMember -Team $team.Name).Count); '' }"
  os: "{{ vendor }}"
  inspection_criteria:
    status_ok: "Up"
    min_members: 2
  is_compare: true
  is_save: true
  timeout: 20
  sleep: 0.2
  message: "{{ message_data }}"

- rule_key: "ping_loss_status"
  cmd_id: "0018"
  name: "18.PingLoss 상태"
  command: >
    powershell.exe -NoProfile -Command "$gw = (Get-NetRoute -DestinationPrefix '192.0.2.10/0' | Sort-Object RouteMetric | Select-Object -First 1 -ExpandProperty NextHop); if (-not $gw) { 'NO_DEFAULT_GATEWAY'; exit 0 }; ping -n 5 $gw"
  os: "{{ vendor }}"
  inspection_criteria:
    max_loss: 0
    max_avg_rtt: 100
  is_compare: true
  is_save: true
  timeout: 20
  sleep: 0.2
  message: "{{ message_data }}"

- rule_key: "path_redundancy_status"
  cmd_id: "0019"
  name: "19.Path 이중화 상태"
  command: >
    powershell.exe -NoProfile -Command "$cmd = Get-Command Get-MPIOPath -ErrorAction SilentlyContinue; if (-not $cmd) { 'NOT_APPLICABLE=Get-MPIOPath unavailable'; exit 0 }; $paths = Get-MPIOPath; if (-not $paths) { 'NOT_APPLICABLE=No MPIO path'; exit 0 }; $paths | Group-Object InstanceName | ForEach-Object {
      'Name=' + $_.Name;
      'PathCount=' + $_.Count;
      'ActivePaths=' + (($_.Group | Where-Object { $_.PathState -match 'Active|Up|Online' }).Count);
      'State=' + ((($_.Group | Select-Object -ExpandProperty PathState -Unique) -join ','));
      ''
    }"
  os: "{{ vendor }}"
  inspection_criteria: ""
  is_compare: true
  is_save: true
  timeout: 20
  sleep: 0.2
  message: "{{ message_data }}"

- rule_key: "hba_connection_status"
  cmd_id: "0020"
  name: "20.HBA 연결상태 점검"
  command: >
    powershell.exe -NoProfile -Command "$cmd = Get-Command Get-InitiatorPort -ErrorAction SilentlyContinue; if (-not $cmd) { 'NOT_APPLICABLE=Get-InitiatorPort unavailable'; exit 0 }; $ports = Get-InitiatorPort; if (-not $ports) { 'NOT_APPLICABLE=No initiator port'; exit 0 }; foreach ($p in $ports) {
      'NodeAddress=' + $p.NodeAddress;
      'PortAddress=' + $p.PortAddress;
      'ConnectionType=' + $p.ConnectionType;
      'PortState=' + $p.PortState;
      ''
    }"
  os: "{{ vendor }}"
  inspection_criteria: ""
  is_compare: true
  is_save: true
  timeout: 20
  sleep: 0.2
  message: "{{ message_data }}"
