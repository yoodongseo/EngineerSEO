---
- name: mongo_play
  hosts: all
  gather_facts: false
  
  vars_files:
    - ../vars/mongodb_vars.yml
  
  module_defaults:
    fap.custom.exec_command_prompt:
      fap_vars: "{{ fap }}"
      protocol: ssh                         # auto(default)|telnet|ssh
      ip: "{{ inventory_hostname }}"
      ssh_port: "{{ ansible_port | default(22) }}"
      result_type: cli_data                  # list|dict|cli_data
      user_id: "{{ ansible_user }}"
      user_password: "{{ ansible_password | default('') }}"
      become_method: "{{ ansible_become_method | default('') }}"
      become_password: "{{ ansible_become_password | default('') }}"
      target_type: "server"
      # network_os: "{{ model | default('') }}"

  tasks:
    - block:
        - name: 프로세스 명령어
          raw: ps -ef | grep mongo
          register: ps_result
          
        - name: 포트 확인
          raw: netstat -nlpt
          register: netstat_result
          
        - name: 명령어 debug
          debug:
            msg: |
              프로세스 확인 :
              {{ ps_result.stdout }}
          
              --
          
              포트 확인 :
              {{ netstat_result.stdout }}
