---
- name: file debug
  debug:
    var: mdsics_report_data.stdout

- name: mdsics python 실행
  command: /usr/bin/python3 ../vars/ex_mdsics.py
  environment:
    report_data: "{{ mdsics_report_data.stdout }}"
    save_path: "{{ mdsics_save_path }}"
    output_name: "{{ mdsics_name }}"
    host: "{{ fap.host_name }}"
  register: report_py
  delegate_to: localhost

- name: mdsics python debug
  debug:
    var: report_py

- name: mdsics result_value reset
  set_fact:
    result_value: []

- name: mdsics 결과 파일 DB화 작업
  set_fact:
    result_value: "{{ result_value | default([]) + [{
      'host': inventory_hostname,
      'host_name': fap.host_ip,
      'is_success': true,
      'file_path': mdsics_save_path,
      'report_type': mdsics_report_name,
      'system': '무정차_민자_내부복제_일일점검'
      }] }}"
    delegate_to: localhost

- name: mdsics Debug DB화
  debug:
    var: result_value

- name: mdsics Make content value
  set_fact:
    content_value: "{{ content_value | default({}) | combine({'data_list': result_value}) }}"
  delegate_to: localhost
- debug: var=content_value

- name: mdsics Save DB
  fap.common.save_data:
    content: "{{ content_value }}"
    protocol: http
    hostname: "{{ inventory_hostname }}"
    data_type: report
    data_key: ex_report
    template_id: "{{ fap.template_id | default(omit) }}"
    job_id: "{{ fap.job_id | default(omit) }}"
  delegate_to: localhost