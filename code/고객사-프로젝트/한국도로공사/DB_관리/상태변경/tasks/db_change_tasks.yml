---
- name: ACLEDB1 HA 전환
  shell: "mcgroup -move {{ item.name }}_RG -n ACLEDB1"
  register: mccs_failover
  loop: "{{ oracle_sid }}"
  loop_control:
    label: "{{ item.name }}"
    pause: 3

- name: HA 전환 결과
  debug:
    msg: "{{ item.stdout }}"
  loop: "{{ mccs_failover.results}}"
  loop_control:
    label: "{{ item.item.name }}"

- name: "HA 전환 결과 로그 저장"
  blockinfile:
    path: "{{ file_path }}"
    block: |
      {{ item.stdout }} 
    create: true
    marker: "--- HA 전환 결과 --- {mark}"
    marker_begin: "{{ item.item.name }}"
    marker_end: "{{ item.item.name }} \n"
  delegate_to: localhost
  loop: "{{ mccs_failover.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: mcgroup ONLINE 확인
  shell: "mcgroup -list | grep {{ item.name }}_RG | grep 'ACLEDB1 ONLINE'"
  register: mcgroup_online
  until: "'ACLEDB1 ONLINE' in mcgroup_online.stdout"
  retries: 5
  delay: 3
  loop: "{{ oracle_sid }}"
  loop_control:
    label: "{{ item.name }}"

- name: mcgroup ONLINE 결과 확인
  debug:
    msg: "{{ item.stdout }}"
  loop: "{{ mcgroup_online.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: "mcgroup ONLINE 결과 로그 저장"
  blockinfile:
    path: "{{ file_path }}"
    block: |
      {{ item.stdout }} 
    create: true
    marker: "--- mcgroup ONLINE 결과 --- {mark}"
    marker_begin: "{{ item.item.name }}"
    marker_end: "{{ item.item.name }} \n"
  delegate_to: localhost
  loop: "{{ mcgroup_online.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Repli-X Status 확인
  shell: bsradm status | egrep -w "{{ item.bsradm }}" -B 1 -A 4 | grep "ACLEDB1 role"
  register: bsradm_result
  until: "'Secondary' not in bsradm_result.stdout"
  retries: 5
  delay: 3
  loop: "{{ oracle_sid }}"
  loop_control:
    label: "{{ item.name }}"

- name: Repli-X Status 결과 확인
  debug:
    msg: "{{ item.stdout }}"
  loop: "{{ bsradm_result.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: "Repli-X Status 결과 로그 저장"
  blockinfile:
    path: "{{ file_path }}"
    block: |
      {{ item.stdout }} 
    create: true
    marker: "--- Repli-X Status 결과 --- {mark}"
    marker_begin: "{{ item.item.name }}"
    marker_end: "{{ item.item.name }} \n"
  delegate_to: localhost
  loop: "{{ bsradm_result.results }}"
  loop_control:
    label: "{{ item.item.name }}"

