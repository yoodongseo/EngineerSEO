- name: 볼륨 확인
  shell: "df -h | grep -i {{ item.name }} | wc -l"
  register: df_result
  until: df_result.stdout.strip() == '0'
  retries: 5          # 최대 시도 횟수
  delay: 3           # 각 시도 사이의 대기 시간 (초)
  loop: "{{ oracle_sid }}"
  loop_control:
    label: "{{ item.name }}"

- name: 전체 볼륨 확인
  shell: "df -h"
  register: total_df

- name: 전체 볼륨 확인 Debug
  debug:
    var: total_df.stdout

- name: "전체 볼륨 확인 로그 저장"
  blockinfile:
    path: "{{ file_path }}"
    block: |
      {{ total_df.stdout }} 
    create: true
    marker: "--- 전체 볼륨 확인 --- {mark}"
    # marker_begin: "{{ item.item.name }}"
    # marker_end: "{{ item.item.name }} \n"
  delegate_to: localhost

- name: result_value set_fact
  set_fact:
    result_value: "{{ result_value | default({}) | combine({
    'host': inventory_hostname,
    'host_name': fap.host_ip,
    'is_success': true,
    'is_pass': true,
    'file_path': file_dir,
    'report_type': report_type,
    'system': 'Linux'
    }) }}"
  delegate_to: localhost

- set_fact:
    merged_value: "{{ merged_value | default([]) + [result_value] }}"