---
- name: 한국도로공사 DB EDB#2 > EDB#1
  hosts: all
  gather_facts: false
  ignore_errors: true
  tasks:
    - block:
      - name: 날짜 연+월
        raw: date +'%Y%m%d%H%M'
        register: today

      - name: 변수 호출
        include_vars: ../vars/db_change_vars.yml

      - name: "DB 전환 EDB#2 > EDB#1 작업 호출"
        include_tasks: ../tasks/db_change_tasks.yml
        #when: "{{ inventory_hostname }} == '192.168.1.16'"

      always:
        - set_fact:
            content_value: "{{ content_value | default({}) | combine({'data_list': merged_value}) }}"
          
        - fap.common.save_data:
            content: "{{ content_value }}"
            protocol: http
            hostname: "{{ inventory_hostname }}"
            data_type: "report"
            data_key: "dr_live"
            template_id: "{{ fap.template_id }}"
            job_id: "{{ fap.job_id }}"
          delegate_to: localhost
