---
make_result_sh: |
  #!/bin/sh

  LANG=C
  export LANG

  alias ls=ls 
  alias grep=/bin/grep 

  _PWD=`/bin/pwd`
  _ORA_DIR=$_PWD
  _TMP_DIR=$_PWD/tmp
  _RET_TXT=$_ORA_DIR/"oracle_"`hostname`.txt
  _ERROR_TXT=$_TMP_DIR/Error_log.txt



  echo "****************************************************************************" >> $_RET_TXT 
  echo "*                          CAS(Oracle_LINUX) Checklist                     *" >> $_RET_TXT 
  echo "****************************************************************************" >> $_RET_TXT 
  echo "*              Copyright 2021 CAS Co. Ltd. All right Reserved              *" >> $_RET_TXT 
  echo "****************************************************************************" >> $_RET_TXT 
  echo " " >> $_RET_TXT 
  echo " " >> $_RET_TXT 

  echo "----- START TIME -----------------------------------------------------------" >> $_RET_TXT 
  echo "" >> $_RET_TXT 
  /bin/date >> $_RET_TXT 

  echo "******************************* Start Script *******************************" >> $_RET_TXT
  echo " " >> $_RET_TXT

  # Oracle directory
  _ORA_HOME=`cat $_TMP_DIR/ora_home_dir.txt`
  _ORA_TNS=$_ORA_HOME/network/admin
  _ORA_DBS=$_ORA_HOME/dbs


  # Backup TNS file
  if [ -f $_ORA_TNS/listener.ora ]
    then
        cat "$_ORA_TNS/listener.ora" > $_TMP_DIR/listener.txt
  fi
  if [ -f $_ORA_TNS/sqlnet.ora ]
    then
        cat "$_ORA_TNS/sqlnet.ora" > $_TMP_DIR/sqlnet.txt
  fi



  echo "----- IFCONFIG /A ----------------------------------------------------------" >> $_RET_TXT
  echo " " >> $_RET_TXT
  ifconfig -a >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo " " >> $_RET_TXT


  echo "<##__D-01 START__##>"                                                         >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo "D-01. 기본 계정의 패스워드 정책 등을 변경하여 사용" >> $_RET_TXT
  echo "=============================================================================" >> $_RET_TXT

  echo "■ 기준" >> $_RET_TXT
  echo "기본 계정의 디폴트 패스워드 및 권한 정책을 변경하여 사용하는 경우" >> $_RET_TXT
  echo " " >> $_RET_TXT

  echo "■ 현황" >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo "@ 활성화 되어 있는 계정 정보" >> $_RET_TXT
  cat $_TMP_DIR/D-1.txt >> $_RET_TXT
  echo " " >> $_RET_TXT

  echo " " >> $_RET_TXT
  echo "<##__D-01 END__##>"                                                           >> $_RET_TXT
  echo "=============================================================================" >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo " " >> $_RET_TXT


  echo "<##__D-02 START__##>"                                                         >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo "D-02. 데이터베이스의 불필요 계정을 제거하거나 잠금설정 후 사용" >> $_RET_TXT
  echo "=============================================================================" >> $_RET_TXT

  echo "■ 기준" >> $_RET_TXT
  echo "계정 정보를 확인하여 불필요한 계정이 없는 경우" >> $_RET_TXT
  echo " " >> $_RET_TXT

  echo "■ 현황" >> $_RET_TXT
  cat $_TMP_DIR/D-2.txt >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo "<##__D-02 END__##>"                                                           >> $_RET_TXT
  echo "=============================================================================" >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo " " >> $_RET_TXT


  echo "<##__D-03 START__##>"                                                         >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo "D-03. 패스워드의 사용기간 및 복잡도를 기관 정책에 맞도록 설정" >> $_RET_TXT
  echo "=============================================================================" >> $_RET_TXT

  echo "■ 기준" >> $_RET_TXT
  echo "기관 정책에 맞게 패스워드 사용기간 및 복잡도 설정이 적용되어 있는 경우" >> $_RET_TXT
  echo " " >> $_RET_TXT

  echo "■ 현황" >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo "@ 활성화 되어 있는 계정 정보" >> $_RET_TXT
  cat $_TMP_DIR/D-3.txt >> $_RET_TXT
  echo " " >> $_RET_TXT

  echo "@ 패스워드 사용기간 및 복잡도 설정 확인" >> $_RET_TXT
  cat $_TMP_DIR/D-3-1.txt >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo "<##__D-03 END__##>"                                                           >> $_RET_TXT
  echo "=============================================================================" >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo " " >> $_RET_TXT


  echo "<##__D-04 START__##>"                                                         >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo "D-04. 데이터베이스 관리자 권한을 꼭 필요한 계정 및 그룹에 허용" >> $_RET_TXT
  echo "=============================================================================" >> $_RET_TXT
  echo "■ 기준" >> $_RET_TXT
  echo "관리자 권한이 필요한 계정 및 그룹에만 관리자 권한이 부여된 경우" >> $_RET_TXT
  echo " " >> $_RET_TXT

  echo "■ 현황" >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo "@ SYSDBA 권한 점검" >> $_RET_TXT
  cat $_TMP_DIR/D-4.txt >> $_RET_TXT
  echo " " >> $_RET_TXT

  echo "@ DBA 권한을 부여받은 계정" >> $_RET_TXT
  cat $_TMP_DIR/D-4-1.txt >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo "<##__D-04 END__##>"                                                           >> $_RET_TXT
  echo "=============================================================================" >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo " " >> $_RET_TXT


  echo "<##__D-05 START__##>"                                                         >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo "D-05. 원격에서 DB 서버로의 접속 제한" >> $_RET_TXT
  echo "=============================================================================" >> $_RET_TXT

  echo "■ 기준" >> $_RET_TXT
  echo "DB서버에 지정된 IP주소에서만 접근 가능하도록 제한한 경우" >> $_RET_TXT
  echo " " >> $_RET_TXT

  echo "■ 현황" >> $_RET_TXT
  cat $_TMP_DIR/D-5.txt >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo "<##__D-05 END__##>"                                                           >> $_RET_TXT
  echo "=============================================================================" >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo " " >> $_RET_TXT


  echo "<##__D-06 START__##>"                                                         >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo "D-06. DBA 이외의 인가되지 않은 사용자가 시스템 테이블에 접근할 수 없도록 설정" >> $_RET_TXT
  echo "=============================================================================" >> $_RET_TXT

  echo "■ 기준" >> $_RET_TXT
  echo "시스템 테이블이 DBA만 접근 가능하도록 설정되어 있는 경우" >> $_RET_TXT
