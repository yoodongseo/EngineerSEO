  echo " ">> $_RET_TXT

  echo "■ 현황" >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo "@ User 프로파일 설정 확인" >> $_RET_TXT
  cat $_TMP_DIR/D-12.txt >> $_RET_TXT

  echo "@ 프로파일 설정 확인" >> $_RET_TXT
  cat $_TMP_DIR/D-12-1.txt >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo "<##__D-12 END__##>"                                                           >> $_RET_TXT
  echo "=============================================================================" >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo " " >> $_RET_TXT


