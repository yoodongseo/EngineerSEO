  echo " " >> $_RET_TXT
  echo "<##__D-06 END__##>"                                                           >> $_RET_TXT
  echo "=============================================================================" >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo " " >> $_RET_TXT


  echo "<##__D-07 START__##>"                                                         >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo "D-07. 리스너의 패스워드를 설정하여 사용" >> $_RET_TXT
  echo "=============================================================================" >> $_RET_TXT

  echo "■ 기준" >> $_RET_TXT
  echo "Listener의 패스워드가 설정되어 있는 경우" >> $_RET_TXT
  echo " " >> $_RET_TXT

  echo "■ 현황" >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo "[+] listener status" >> $_RET_TXT
  lsnrctl status >> $_TMP_DIR/D-7.txt
  head -n 15 $_TMP_DIR/D-7.txt >> $_RET_TXT

  echo " " >> $_RET_TXT
  echo "<##__D-07 END__##>"                                                           >> $_RET_TXT
  echo "-----------------------------------------------------------------------------" >> $_RET_TXT
  echo "@ 참고사항" >> $_RET_TXT
  echo "  - Oracle 11g2의 경우 암호 기능이 사용되지 않고, 로컬인증방식으로 강제화 되어 있으므로 양호함" >> $_RET_TXT
  echo "-----------------------------------------------------------------------------" >> $_RET_TXT
  echo "=============================================================================" >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo " " >> $_RET_TXT


  echo "<##__D-08 START__##>"                                                         >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo "D-08. 응용프로그램 또는 DBA 계정의 Role이 Public으로 설정되지 않도록 조정" >> $_RET_TXT
  echo "=============================================================================" >> $_RET_TXT

  echo "■ 기준" >> $_RET_TXT
  echo "DBA 계정의 Role이 Public으로 설정되어 있지 않은 경우" >> $_RET_TXT
  echo " " >> $_RET_TXT

  echo "■ 현황" >> $_RET_TXT
  cat $_TMP_DIR/D-8.txt >> $_RET_TXT

  echo " " >> $_RET_TXT
  echo "<##__D-08 END__##>"                                                           >> $_RET_TXT
  echo "-----------------------------------------------------------------------------" >> $_RET_TXT
  echo "@ 참고사항" >> $_RET_TXT
  echo "  - 아무런 값이 출력되지 않는 것은 조회 결과가 없는 것이므로(no rows selected)," >> $_RET_TXT
  echo "	  DBA 계정의 Role이 Public으로 설정되어 있지 않은 것임" >> $_RET_TXT
  echo "-----------------------------------------------------------------------------" >> $_RET_TXT
  echo "=============================================================================" >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo " " >> $_RET_TXT


  echo "<##__D-09 START__##>"                                                         >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo "D-09. OS_ROLES, REMOTE_OS_AUTHENTICATION, REMOTE_OS_ROLES를 FALSE로 설정" >> $_RET_TXT
  echo "=============================================================================" >> $_RET_TXT

  echo "■ 기준" >> $_RET_TXT
  echo "OS_ROLES, REMOTE_OS_AUTHENTICATION, REMOTE_OS_ROLES 설정이 FALSE로 되어 있는 경우" >> $_RET_TXT
  echo " " >> $_RET_TXT

  echo "■ 현황" >> $_RET_TXT
  cat $_TMP_DIR/D-9.txt >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo "<##__D-09 END__##>"                                                           >> $_RET_TXT
  echo "=============================================================================" >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo " " >> $_RET_TXT


  echo "<##__D-10 START__##>"                                                         >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo "D-10. 데이터베이스에 대해 최신 보안패치와 벤더 권고사항을 모두 적용" >> $_RET_TXT
  echo "=============================================================================" >> $_RET_TXT

  echo "■ 기준" >> $_RET_TXT
  echo "정책에 따른 버전별 최신 패치를 적용하고 내부적으로 관리 절차를 수립하여 이행하고 있는 경우" >> $_RET_TXT
  echo " " >> $_RET_TXT

  echo "■ 현황" >> $_RET_TXT
  cat $_TMP_DIR/D-10.txt >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo "<##__D-10 END__##>"                                                           >> $_RET_TXT
  echo "-----------------------------------------------------------------------------" >> $_RET_TXT
  echo "@ 참고사항" >> $_RET_TXT
  echo "  - 버전이 9.2.0, 10.2.0 or 10.1.0이 아니면 아주 취약함" >> $_RET_TXT
  echo "	- oracle 10g Release 2의 patchset level이 192.0.2.10 이나 이후 버전이 아니면 취약함" >> $_RET_TXT
  echo "	- oracle 10g Release 1의 patchset level이 192.0.2.10 이나 이후 버전이 아니면 취약함" >> $_RET_TXT
  echo "	- oracle 9i Release 2의 patchset level이 192.0.2.10 이나 이후 버전이 아니면 취약함" >> $_RET_TXT
  echo "	- oracle 9.0이 oracle 9iAS 또는 oracle AS10g를 지원하기 위해 사용되면 취약함" >> $_RET_TXT
  echo "-----------------------------------------------------------------------------" >> $_RET_TXT
  echo "=============================================================================" >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo " " >> $_RET_TXT



  echo "<##__D-11 START__##>"                                                         >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo "D-11. 데이터베이스의 접근, 변경, 삭제 등의 감사기록이 기관의 감사기록 정책에 적합하도록 설정" >> $_RET_TXT
  echo "=============================================================================" >> $_RET_TXT

  echo "■ 기준" >> $_RET_TXT
  echo "DBMS의 감사 로그 저장 정책이 수립되어 있으며, 정책 설정이 적용되어 있는 경우" >> $_RET_TXT
  echo " " >> $_RET_TXT

  echo "■ 현황" >> $_RET_TXT
  cat $_TMP_DIR/D-11.txt >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo "<##__D-11 END__##>"                                                           >> $_RET_TXT
  echo "-----------------------------------------------------------------------------" >> $_RET_TXT
  echo "@ 점검방법" >> $_RET_TXT
  echo "  - 인터뷰를 통해 데이터베이스 감사기록, 백업 정책 관련 지침 확인 및 실사" >> $_RET_TXT
  echo "-----------------------------------------------------------------------------" >> $_RET_TXT
  echo "=============================================================================" >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo " " >> $_RET_TXT


  echo "<##__D-12 START__##>"                                                         >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo " " >> $_RET_TXT
  echo "D-12. 패스워드 재사용에 대한 제약의 설정" >> $_RET_TXT
