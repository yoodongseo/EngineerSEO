---
- block:
  - name: Agent 재기동
    shell: "{{ agent_mgmt_polestar['restart'] }}"
    register: result_agent_restart

  always:
    - name: Save DATA Merged 생성
      set_fact:
        merged_value: "{{ merged_value | default([]) + [{
          'host': fap['host_ip'],
          'host_name': fap['host_ip'],
          'name': '2. Agent 재기동',
          'command': 'Polestar uninstall cmd',
          'result': result_agent_restart['stdout'] | default('unknown'),
          'is_success': True,
          'is_pass': False if result_agent_restart['failed'] | default(True) else True,
          'system': system,
          'report_type': report_type
            }] }}"