---
- block:
  - name: Agent 제거
    shell: "{{ agent_mgmt_polestar['uninstall'] }}"
    register: result_agent_uninstall

  always:
    - name: Save DATA Merged 생성
      set_fact:
        merged_value: "{{ merged_value | default([]) + [{
          'host': fap['host_ip'],
          'host_name': fap['host_ip'],
          'name': '2. Agent 삭제',
          'command': 'Polestar uninstall cmd',
          'result': result_agent_uninstall['stdout'] | default('unknown'),
          'is_success': True,
          'is_pass': False if result_agent_uninstall['failed'] | default(True) else True,
          'system': system,
          'report_type': report_type
            }] }}"