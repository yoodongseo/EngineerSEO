---
- name: Linux Update
  hosts: all
  strategy: free
  gather_facts: False
  ignore_errors: False
  ignore_unreachable: True
  vars_files:
    - ../vars/lnx_patch_vars.yml
  tasks:
  - block:
      - name: 1. 연결 상태 점검
        include_tasks: ../tasks/01_lnx_con_tasks.yml

      - name: 2. 업데이트 수행
        include_tasks: ../tasks/02_lnx_patch_tasks.yml
        
    always:
      - name: 데이터 저장 
        include_tasks: ../tasks/save_data.yml 