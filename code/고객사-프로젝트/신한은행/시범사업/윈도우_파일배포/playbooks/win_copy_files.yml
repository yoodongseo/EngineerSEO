---
- name: Window 파일 배포
  hosts: all
  strategy: free
  gather_facts: False
  ignore_errors: False
  ignore_unreachable: True
  vars_files:
    - ../vars/win_copy_vars.yml
  tasks:
  - block:
      - name: 1. 연결 상태 점검
        include_tasks: ../tasks/01_win_con_tasks.yml

      - name: 2. 설정 정보 수집
        include_tasks: ../tasks/02_win_copy_files_tasks.yml
        
    always:
      - name: 데이터 저장
        include_tasks: ../tasks/save_data.yml
