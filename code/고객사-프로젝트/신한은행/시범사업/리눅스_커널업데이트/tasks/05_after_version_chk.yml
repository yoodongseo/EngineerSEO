---
- block:
  - name: 버전 정보 수집
    shell: uname -r
    register: after_version

  always:
    - name: Save DATA Merged 생성
      set_fact:
        merged_value: "{{ merged_value | default([]) + [{
          'host': fap['host_ip'],
          'host_name': fap['host_ip'],
          'name': '5. 작업 후 버전',
          'command': report_type,
          'result': after_version['stdout'] | default(none),
          'is_success': True,
          'is_pass': False if after_version['failed'] | default(True) else True,
          'system': system,
          'report_type': report_type
            }] }}"