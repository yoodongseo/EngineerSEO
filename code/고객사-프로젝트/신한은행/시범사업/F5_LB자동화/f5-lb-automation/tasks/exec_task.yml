---
- block:
    - name: POOL 추가 호출
      include_tasks: "./add_pool.yml"
      when: err_flag|default(true) == false

    - name: VIndex 초기화
      set_fact:
        vserver_idx: 0

    - name: Virtual Server 추가 호출
      include_tasks: "./add_vserver.yml"
      loop: "{{ vinfo }}"
      when: err_flag|default(true) == false

    
    

    - name: VIndex 초기화
      set_fact:
        vserver_idx: 0

