---
- when: err_flag == false
  block:
    - name: Pool 정보 조회
      ansible.builtin.uri:
        url: "{{ host }}/{{ rest_api_info.default_api }}/pool/{{pool_type | lower }}"
        user: "{{ username }}"
        password: "{{ password }}"
        method: GET
        validate_certs: "{{ validate_certs }}"
      register: PoolList
      delegate_to: localhost

    - name: 롤백 대상 검증 -> {{pool_name}}
      set_fact:
        del_flag: "{{1 if pool_name in PoolList['json']['items'] | map(attribute='name') | list  else 0}}"

- when: del_flag|default(0)|int == 1
  block:
    - name: Pool 삭제 -> {{pool_name}}
      ansible.builtin.uri:
        url: "{{ host }}/{{ rest_api_info.default_api }}/pool/{{pool_type | lower }}/{{pool_name}} "
        user: "{{ username }}"
        password: "{{ password }}"
        method: DELETE
        validate_certs: false
      register: DelPool
      delegate_to: localhost
    # - debug: var=DelPool

    - name: Pool 롤백 결과 추출
      set_fact:
        rollback_data: "{{ DelPool.json|default([]) }}"
        rollback_err_msg: "{{ DelPool.json|default({}) if DelPool.status|int != 200 else {} }}"
        rollback_err_flag: "{{ false if DelPool.status|default(0)|int == 200 else true }}"
