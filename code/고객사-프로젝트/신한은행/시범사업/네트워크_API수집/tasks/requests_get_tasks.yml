---
- name: GET API 수행
  ansible.builtin.uri:
    url: "{{ API_URL }}"
    method: GET
    user: "{{ ansible_user }}"
    password: "{{ ansible_password }}"
    force_basic_auth: true
    return_content: true
    headers:
      Content-Type: "application/json"
    status_code: "{{ status_code }}"
    validate_certs: "{{ validate_certs }}"
  register: get_response