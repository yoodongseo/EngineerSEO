---
- name: 예방점검
  hosts: all
  strategy: free
  gather_facts: false 
  ignore_errors: false
  ignore_unreachable: true
  tasks:
    - block:
    ### vars 파일 호출(점검 명령어 및 python filter 기입 변수 수집)
      - name: vars 호출
        include_vars: ../vars/pre_vars.yml

    ### 점검 보고서 데이터 생성 / python filter을 통한 항목 별 merged_value 생성
    ### 대상 장비 별 List형 변수 호출 및 반복(인벤토리 변수에 vendor 추가)
      - name: 재기동 전 작업
        include_tasks: ../tasks/pre_task_before.yml
        loop: >-
          {{ axgate if vendor == 'axgate'
          else cisco if vendor == 'cisco' 
          else nexg if vendor == 'nexg'
          else juniper if vendor == 'juniper'
          else nxos if vendor == 'nxos' }}
        loop_control:
          label: "{{ item }}"
        # no_log: true

        ### 생성된 merged_value 데이터를 content_value로 취합
      - name: Make content value
        set_fact:
          content_value: "{{ content_value | default({}) | combine({'data_list': merged_value}) }}"
        delegate_to: localhost
        when: merged_value is defined
      
      ### fap모듈 --- content_value -> DB 삽입
      - name: Save to DB
        fap.common.save_data:
          content: "{{ content_value }}"
          protocol: http
          hostname: "{{ inventory_hostname }}"
          # data_type: cli_data
          data_type: backup
          data_key: network
          template_id: "{{ fap.template_id | default(omit) }}"
          job_id: "{{ fap.job_id | default(omit) }}"
        delegate_to: localhost
        when: content_value is defined

      - set_fact:
          merged_value: []
          content_value: {}

      - name: 재기동 후 접속 테스트 
        # shell: "ping -W 1 -c 1 {{ fap.host_ip }}"
        shell: "ping -W 1 -c 1 {{ fap['host_ip'] }}"
        register: ping_result
        until: ping_result.failed == False
        retries: 2
        delay: 1
        delegate_to: localhost
        ignore_errors: False

      - name: 재기동 이후 작업
        include_tasks: ../tasks/pre_task_after.yml
        loop: >-
          {{ axgate if vendor == 'axgate'
          else cisco if vendor == 'cisco' 
          else nexg if vendor == 'nexg'
          else juniper if vendor == 'juniper'
          else nxos if vendor == 'nxos' }}
        loop_control:
          label: "{{ item }}"
        # no_log: true

      ### 생성된 merged_value 데이터를 content_value로 취합
      - name: Make content value
        set_fact:
          content_value: "{{ content_value | default({}) | combine({'data_list': merged_value}) }}"
        delegate_to: localhost
        when: merged_value is defined
      
      ### fap모듈 --- content_value -> DB 삽입
      - name: Save to DB
        fap.common.save_data:
          content: "{{ content_value }}"
          protocol: http
          hostname: "{{ inventory_hostname }}"
          # data_type: cli_data
          data_type: backup
          data_key: network
          template_id: "{{ fap.template_id | default(omit) }}"
          job_id: "{{ fap.job_id | default(omit) }}"
        delegate_to: localhost
        when: content_value is defined