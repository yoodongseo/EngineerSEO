---
- name: 네트워크 리소스 점검
  hosts: all
  strategy: free
  gather_facts: false 
  ignore_errors: false
  ignore_unreachable: true
  vars_files: ### vars 파일 호출(점검 명령어 및 python filter 기입 변수 수집)
    - ../vars/resource_vars.yml
  tasks:
    - block:
      - name: 1. 연결 상태 점검
        include_tasks: ../tasks/00_nw_con_check.yml

      - name: 2. 네트워크 리소스 점검 작업
        include_tasks: ../tasks/01_nw_resource_tasks.yml
        loop: >-
          {{ axgate if vendor == 'axgate'
          else cisco if vendor == 'cisco' 
          else nexg if vendor == 'nexg'
          else juniper if vendor == 'juniper'
          else nxos if vendor == 'nxos' }}
        loop_control:
          label: "{{ item['cmd_name'] }}"
          
      always:
        - name: 데이터 저장
          include_tasks: ../tasks/save_data.yml