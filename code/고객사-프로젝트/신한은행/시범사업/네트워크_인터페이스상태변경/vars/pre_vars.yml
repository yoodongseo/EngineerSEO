juniper:
  - cmd_name: "인터페이스 상태 변경"
    cmd_command: '인터페이스 상태 변경'
    value: "str"
    com_value: "Fail"
    message: |
        1. 인터페이스 상태 변경
    raw: ''
    multi_raw:
      - 'show configuration interfaces {{ interface_name }}' ## before
      - 'configure'
      - "{{ 'set' if job_flag == 'Down' else 'delete' }} interface {{ interface_name }} disable"
