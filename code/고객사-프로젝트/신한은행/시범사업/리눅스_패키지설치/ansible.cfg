[ssh_connection]
pipelining = True # 2021.11.15 woochan

[defaults]
collections_paths = /fap/ansible/ansible_collections
inventory = /fap/ansible/inventory
bin_ansible_callbacks = False
retry_files_enabled = False
roles_path = /fap/ansible/projects/신한_Linux_패키지설치/roles
host_key_checking = False
library = /fap/ansible/modules
stdout_callback = yaml
filter_plugins = /fap/ansible/plugins/filter:/fap/ansible/projects/신한_Linux_패키지설치/vars
deprecation_warnings = False

