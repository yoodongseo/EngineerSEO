---
### Linux 대상 점검 명령어 수행 및 점검결과 변수처리
- name: '명령어 수행_python {{ item.message }}' ### Linux
  command: /usr/bin/python3 ../vars/raw.py
  environment:
    hostname: '{{ fap.host_ip }}'
    port: '{{ ansible_port }}'
    username: '{{ ansible_user }}'
    password: "{{ ansible_password }}"
    root_passwd: "{{ ansible_become_password | default('') }}"
    raw: '{{ item.raw }}'
    vendor: '{{ vendor }}'
    time: '{{ item.time }}'
  when: vendor == 'Linux' or vendor == 'L3' or vendor == 'L4' or vendor == 'Axgate'
  register: total_item_raw
  delegate_to: localhost

- name: 'Windows 명령어 실행 {{ item.message }}'
  win_shell: |
    {{ item.raw }}
  args:
    output_encoding_override: "{{ 'EUC-KR' if item.raw == 'w32tm /query /status' else omit }}"
  register: total_item_windows
  when: vendor == 'Windows'

- name: 'Secui 명령어 수행_python {{ item.message }}' ### Secui
  command: /usr/bin/python3 ../vars/secui.py
  environment:
    hostname: '{{ fap.host_ip }}'
    port: '{{ ansible_port }}'
    username: '{{ ansible_user }}'
    password: "{{ ansible_password }}"
    root_passwd: "{{ ansible_become_password | default('') }}"
    raw: '{{ item.raw }}'
    vendor: '{{ vendor }}'
    time: '{{ item.time }}'
  when: vendor == 'Secui'
  register: total_item_secui
  delegate_to: localhost

- name: total_item 설정 - windows 변수 사용
  set_fact:
    total_item: '{{ total_item_windows }}'
  when: total_item_windows.changed == True

- name: total_item 설정 - raw 변수 사용
  set_fact:
    total_item: '{{ total_item_raw }}'
  when: total_item_raw.changed == True

- name: total_item 설정 - secui 변수 사용
  set_fact:
    total_item: '{{ total_item_secui }}'
  when: total_item_secui.changed == True

