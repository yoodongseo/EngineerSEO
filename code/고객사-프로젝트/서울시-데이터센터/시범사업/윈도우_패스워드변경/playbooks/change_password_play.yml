---
- name: change_password_play
  hosts: all
  strategy: free
  gather_facts: false
  tasks: 
    - name: vars 호출
      include_vars: ../vars/passwd_vars.yml

    - name: 날짜 연+월
      set_fact:
        fap_today: "{{ lookup('ansible.builtin.pipe','date +%Y%m')}}" # 연 월 합친 변수 생성
      delegate_to: localhost

    - name: 현재 패스워드 확인
      debug:
        msg: 
          - "현재 User 패스워드 : {{ ansible_password }}"

    - name: 실행 계정 추출
      fap.common.get_credential:
        credential_name: "{{ fap_today }}win"
        host_ip: "{{ fap.host_ip | default(omit) }}"
        host_name: "{{ fap.host_name | default(omit)}}"
      register: user_info
      delegate_to: localhost

    - name: 실행 계정 패스워드 패턴 추출
      set_fact:
        month_user: "{{ user_info.data.username }}"
        month_pass: "{{ user_info.data.password }}"
        # month_pass: "{{ user_info.data.password | regex_replace('\\${3}', '%03d' % (fap.host_ip.split('.')[2] | int)) }}"

    - name: 변경 계정 출력
      debug:
        msg:
          - "{{ month_user }}"
          - "{{ month_pass }}"

    - name: 접속 확인
      win_ping:
      when: 
        - ansible_port == 5985
        - month_user == "sdcadmin"

    - name: Windows tasks
      include_tasks: ../tasks/windows_passwd.yml
      when: 
        - ansible_port == 5985
        - month_user == "sdcadmin"

    # - name: "FAP root password 변경 "
    #   fap.common.change_host_credential:
    #     host_ip: "{{ fap.host_ip }}"
    #     become_password: "{{ month_pass }}"
    #   delegate_to: localhost
    #   when: month_user == 'root'

    - name: "FAP sdcadmin password 변경 "
      fap.common.change_host_credential:
        host_ip: "{{ fap.host_ip }}"
        password: "{{ month_pass }}"
      delegate_to: localhost
      when: month_user == 'sdcadmin'

    - name: DB Save
      include_tasks: ../tasks/py_passwd_dbsave.yml
