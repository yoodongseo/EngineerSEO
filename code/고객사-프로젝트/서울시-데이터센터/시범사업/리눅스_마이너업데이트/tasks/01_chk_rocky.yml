---
- block:
  # STEP 1 연결 상태 확인 및 기존 정보 확인
  - name: 1.1. 버전 8.X 점검
    shell: "{{ chk_lnx_cmd }}"
    register: result_chk_lnx_cmd
    timeout: "{{ command_timeout }}"
  
  - name: 실패 처리 # 초기 연결 과정에서 실패했을 경우(ignore_unreachable 영향)
    fail:
      msg: "{{ fap['host_ip'] }}"
    when: result_chk_lnx_cmd['failed'] | default(True)

  always: 
  - name: Save DATA Merged 생성
    set_fact:
      merged_value: "{{ merged_value + [{
        'host': fap['host_ip'],
        'host_name': fap['host_ip'],
        'name': '01. 작업 전 버전정보',
        'command': 'chk_lnx_cmd',
        'result': result_chk_lnx_cmd['stdout'] | default('알 수 없음'),
        'is_success': False if result_chk_lnx_cmd['failed'] else True,
        'is_pass': False if result_chk_lnx_cmd['failed'] else True,
        'system': system,
        'report_type': report_type
          }] }}"