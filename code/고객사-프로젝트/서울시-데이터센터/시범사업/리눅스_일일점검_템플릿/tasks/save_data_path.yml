---
- name: 저장 경로 생성
  file:
    state: directory
    path: item['path']
  delegate_to: localhost

### Linux 대상 점검 명령어 수행 및 점검결과 변수처리
- name: "명령어 수행_python {{ item.message }}" ### Linux
  command: /usr/bin/python3 ../vars/multi_raw.py
  environment:
    hostname: "{{ fap.host_ip }}"
    port: "{{ ansible_port }}"
    username: "{{ ansible_user }}"
    password: "{{ ansible_password }}"
    root_passwd: "{{ ansible_become_password | default('') }}"
    raw: "{{ item.raw }}"
    multi_raw: "{{ multi_raw | to_json }}"
    vendor: "{{ vendor }}"
    time: "{{ item.time }}"
  register: total_item
  vars: 
    multi_raw:
      - ''
  delegate_to: localhost

- name: "{{ item['name'] }} - 파일 다운로드"
  fetch:
    src: "{{ copy.dest }}/{{ download_file }}"
    dest: "{{ item['path'] }}"
    flat: true

- name: Save DATA Merged 생성 - 점검 파일 다운로드
  set_fact:
    merged_value: "{{ merged_value | default([]) + [{
      'host': fap['host_ip'],
      'host_name': fap['host_ip'],
      'is_success': True,
      'system': system,
      'file_path': item['path'],
      'report_type': report_type
      }] }}"


