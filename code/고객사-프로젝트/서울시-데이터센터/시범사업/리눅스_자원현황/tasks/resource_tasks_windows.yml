---
- name: facts check
  setup:
  
- name: 01. WINDOWS - OS, version, type, kernel
  set_fact:
    merged_value: "{{ merged_value | combine({'os_name': ansible_facts.distribution, 'os_type': ansible_facts.system}) }}"
- name: 01. WINDOWS - kernel
  set_fact:
    merged_value: "{{ merged_value | combine({'kernel': ansible_facts.kernel, 'os_version': ansible_facts.distribution_version }) }}"

- name: Get Disk Volume Info
  win_shell: Get-Volume | Select-Object DriveLetter, FileSystemLabel, FileSystem, SizeRemaining, Size | ConvertTo-Csv -NoTypeInformation
  register: disk_info

- name: Process Disk Info
  set_fact:
    df_list: "{{ df_list | default([]) + [ \
              { 'filesystem': (item.split(',')[1] | regex_replace('^\"|\"$', '') + '(' + item.split(',')[2] | regex_replace('^\"|\"$', '') + ')'), \
                'size': (item.split(',')[4] | regex_replace('^\"|\"$', '') | int / 1024 / 1024 | round) | int, \
                'used': ((item.split(',')[4] | regex_replace('^\"|\"$', '') | int - item.split(',')[3] | regex_replace('^\"|\"$', '') | int) / 1024 / 1024 | round) | int, \
                'avail': (item.split(',')[3] | regex_replace('^\"|\"$', '') | int / 1024 / 1024 | round) | int, \
                'mounted': (item.split(',')[0] | regex_replace('^\"|\"$', '')) } \
              ] }}"
  loop: "{{ disk_info.stdout_lines[1:] }}"

- name: set_fact
  set_fact:
    merged_value: "{{ merged_value | combine({'disk_list': df_list }) }}"

- name: 02. WINDOWS - Disk size
  win_shell: "(Get-PhysicalDisk | Select-Object -Property Size | Measure-Object -Property 'Size' -Sum).Sum / 1MB"
  register: disk_size
- name: set_fact
  set_fact:
    merged_value: "{{ merged_value | combine({'disk_size': disk_size.stdout_lines[0] | trim }) }}"

- name: 03. WINDOWS - Uptime info
  win_shell: |
    $bootuptime = (Get-CimInstance -ClassName Win32_OperatingSystem).LastBootUpTime
    $CurrentDate = Get-Date
    $uptime = $CurrentDate - $bootuptime
    Write-Output "$($uptime.days) Days, $($uptime.Hours) Hours, $($uptime.Minutes) Minutes"
  register: uptime_info
- name: set_fact
  set_fact:
    merged_value: "{{ merged_value | combine({'uptime': uptime_info.stdout_lines[0] }) }}"

- name: 04. WINDOWS - CPU Usage
  win_shell: "Get-WmiObject win32_processor | Measure-Object -property LoadPercentage -Average | Select Average"
  register: cpu_info
- name: set_fact
  set_fact:
    merged_value: "{{ merged_value | combine({'cpu': cpu_info.stdout_lines[3] | trim }) }}"
- name: 04. WINDOWS - CPU Cores
  set_fact:
    merged_value: "{{ merged_value | combine({'cpu_cores': ansible_facts.processor_count }) }}"

- name: 05. WINDOWS - Memory Usage
  win_shell: |
    $CompObject =  Get-WmiObject -Class WIN32_OperatingSystem
    $Memory = ((($CompObject.TotalVisibleMemorySize - $CompObject.FreePhysicalMemory)*100)/ $CompObject.TotalVisibleMemorySize)
    Write-Host $Memory
  register: memory_info
- name: set_fact
  set_fact:
    merged_value: "{{ merged_value | combine({'memory': memory_info.stdout_lines[0] | trim }) }}"
- name: 05. WINDOWS - Memory size
  win_shell: "(Get-CimInstance Win32_PhysicalMemory | Measure-Object -Property capacity -Sum).sum /1mb"
  register: memory_size
- name: set_fact
  set_fact:
    merged_value: "{{ merged_value | combine({'memory_size': memory_size.stdout_lines[0] | trim }) }}"

- name: 06. WINDOWS - User list
  win_shell: "gwmi win32_UserAccount | Select Name | ForEach-Object {$_.Name}"
  register: user_list
- name: set_fact
  set_fact:
    merged_value: "{{ merged_value | combine({'user_list': user_list.stdout_lines | select('match', '.+') | list } ) }}"

- name: 07. WINDOWS - Service list
  win_shell: Get-Service | Select-object @{Name='name';Expression={"$($_.DisplayName)"}}, @{Name='status';Expression={"$($_.Status)"}}, @{Name='source';Expression={"$($_.ServiceType)"}}, @{Name='state';Expression={"$($_.StartType)"}} | ConvertTo-json
  register: service_info

- name: set_fact
  set_fact:
    merged_value: "{{ merged_value | combine({'service_list': service_info.stdout | from_json }) }}"

- name: 08. WINDOWS - Package list
  win_shell: Get-Package | Select-Object @{Name='name'; Expression={$_.Name}}, @{Name='version'; Expression={$_.Version}}, @{Name='release'; Expression={$_.ProviderName}}, @{Name='source'; Expression={$_.Source}} | ConvertTo-Json
  register: package_info

- name: 08. WINDOWS - Package List arch
  win_shell: (Get-WmiObject Win32_ComputerSystem).SystemType
  register: win_arch

- name: set_fact
  set_fact:
   merged_value: "{{ merged_value | combine({'package_list': package_info.stdout | from_json }) }}"
