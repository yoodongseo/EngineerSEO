---
- name: change_password_play
  hosts: all
  strategy: free
  gather_facts: false
  tasks: 
    - name: vars 호출
      include_vars: ../vars/passwd_vars.yml

    - name: 날짜 연+월
      set_fact:
        fap_today: "{{ lookup('ansible.builtin.pipe','date +%Y%m')}}" # 연 월 합친 변수 생성
      delegate_to: localhost

    - name: 현재 패스워드 확인
      debug:
        msg: 
          - "현재 User 패스워드 : {{ ansible_password }}"
          # - "현재 Root 패스워드 : {{ ansible_become_password }}"

    - name: 실행 계정 추출
      fap.common.get_credential:
        credential_name: "{{ fap_today }}"
        host_ip: "{{ fap.host_ip | default(omit) }}"
        host_name: "{{ fap.host_name | default(omit)}}"
        #credential_name: "pattern"
      register: user_info
      delegate_to: localhost
    
    - name: 실행 계정 패스워드 패턴 추출
      set_fact:
        month_user: "{{ user_info.data.username }}"
        # month_pass: "{{ user_info.data.password | regex_replace('\\${3}', '%03d' % (fap.host_ip.split('.')[2] | int)) }}"
        month_pass: "{{ user_info.data.password }}"

    - name: 변경 계정 출력
      debug:
        msg:
          - "{{ month_user }}"
          - "{{ month_pass }}"

    - name: 접속 확인
      raw: whoami
      register: uname_result
      ignore_errors: yes
      when: ansible_port != 5985
      
    - name: 접속 결과 실패 중단
      fail:
        msg: "접속 불가합니다. 통신 확인"
      when: 
        - uname_result.rc != 0  # 명령이 정상적으로 실행되지 않은 경우에만 중단
        - ansible_port != 5985

    - name: 접속 결과 성공 확인
      debug:
        msg: "접속 결과 : {{ uname_result.stdout }}"

    - name: python tasks
      include_tasks: ../tasks/python_passwd.yml
      when: ansible_port != 5985

    - name: DB Save
      include_tasks: ../tasks/py_passwd_dbsave.yml
    
    - name: python 패스워드 변경 실패
      fail:
        msg: "패스워드 변경 확인 필요로 인벤토리 업데이트 중지"
      when: >-
        '오류' in password_value.stdout or
        '프롬프트를 찾을 수 없습니다.' in password_value.stdout or
        '확인이 필요' in password_value.stdout or
        '실패' in password_value.stdout

    - name: "FAP root password 변경 "
      fap.common.change_host_credential:
        host_ip: "{{ fap.host_ip }}"
        become_user_password: "{{ month_pass }}"
      delegate_to: localhost
      when: month_user == 'root'

    - name: "FAP auto password 변경 "
      fap.common.change_host_credential:
        host_ip: "{{ fap.host_ip }}"
        password: "{{ month_pass }}"
      delegate_to: localhost
      when: month_user == 'auto'
