---
- block:  
  - name: 파일 배포 작업 수행
    copy:
      src: "{{ file_name }}"
      dest: "{{ file_dest }}"
      owner: "{{ file_owner }}" 
      group: "{{ file_group }}"
      mode: "{{ file_mode }}"
    register: result_copy

  - name: 배포 확인
    shell: "ls -al {{ file_dest }}"
    register: copy_output

  always:
    - name: Save DATA Merged 생성
      set_fact:
        merged_value: "{{ merged_value | default([]) + [{
          'host': fap['host_ip'],
          'host_name': fap['host_ip'],
          'name': '2. 파일 배포 결과',
          'command': 'Linux_Copy',
          'result': '배포 오류' if result_copy['failed'] else copy_output.stdout,
          'is_success': True,
          'is_pass': False if result_copy['failed'] else True,
          'system': system,
          'report_type': report_type
            }] }}"
