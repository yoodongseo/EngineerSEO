---
- block:
  - name: 배포 경로 생성
    file:
      path: "{{ copy_dest }}"
      state: directory

  - name: 업데이트 파일 배포
    copy:
      src: "{{ item['name'] }}"
      dest: "{{ copy_dest }}"
    loop: "{{ copy_src }}"
    loop_control: 
      label: "{{ item['name'] }} 파일 배포"

  - name: 커널버전 업데이트 쉘 수행
    shell: "{{ lnx_kernel_update_cli }}"
    register: result_lnx_kernel_update_cli
    timeout: "{{ update_timeout }}"
    no_log: True

  always:
    - name: Save DATA Merged 생성
      set_fact:
        merged_value: "{{ merged_value | default([]) + [{
          'host': fap['host_ip'],
          'host_name': fap['host_ip'],
          'name': '3. 커널 업데이트',
          'command': report_type,
          'result': result_lnx_kernel_update_cli['stdout'] | default(none),
          'is_success': True,
          'is_pass': False if result_lnx_kernel_update_cli['failed'] | default(True) else True,
          'system': system,
          'report_type': report_type
            }] }}"