---
- name: 성공 DB 입력형태 가공
  set_fact:
    merged_value: "{{ merged_value | default([]) + [{
      'host': fap['host_ip'],
      'host_name': fap['host_ip'],
      'is_success': True,
      'file_path': local_dir,
      'system': 'Network',
      'report_type': report_type,
      }] }}"
  when: total_item['failed'] | default(True) == False

- name: 실패 형태 변수 생성
  set_fact:
    merged_value: "{{ merged_value | default([]) + [{
      'host': fap['host_ip'],
      'host_name': fap['host_ip'],
      'is_success': False,
      'file_path': local_dir,
      'system': 'Network',
      'report_type': report_type,
      }] }}"
  when: merged_value is not defined

- name: content_value 변수 생성
  set_fact:
    content_value: "{{ content_value | default({}) | combine({'data_list': merged_value}) }}"

- name: 데이터 저장
  fap.common.save_data:
    content: "{{ content_value }}"
    protocol: http
    hostname: "{{ inventory_hostname }}"
    data_type: report
    data_key: "{{ data_key }}"
    template_id: "{{ fap['template_id'] }}"
    job_id: "{{ fap['job_id'] }}"
  delegate_to: localhost