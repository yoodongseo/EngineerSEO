---
### vars 파일
today: "{{ lookup('pipe', 'date +%Y%m%d') }}"
local_dir: /fap/report/log_down/{{ today }}/{{ fap['job_id'] }}/{{ fap['host_ip'] }}
data_key: "Network_log_down"
report_type: "Network 로그 다운로드"
### merged_value --- List 선언
# merged_value: []

piolink:
  - cmd_name: "show log"
    cmd_command: 'show log'
    value: "str"
    com_value: "Fail"
    message: |
        1. show log
    raw: ""
    multi_raw:
      - 'configure'
      - 'terminal length 0'
      - 'show log'
      - 'terminal length 30' # 기존 30으로 되어 있어서 위와 같이 적용
    arr_num: 0
    grep: ""
    time: 10
    criteria: "Fail 결과 존재 시 비정상"
    tmp_file_path: "../templates/{{ fap['host_ip'] }}_piolink.txt"
    fap_report_file: "{{ fap['host_ip'] }}_{{ vendor }}_log.txt"
    id: 0001

