    arr_num: 0
    grep: ''
    criteria: 'Fail 결과 존재 시 비정상'
    time: 1

  - cmd_name: 'TEMP [show environment]'
    cmd_command: 'show environment '
    value: 'str'
    com_value: |-
      high
      critical
    message: |
      06. 설비 동작 상태 점검
      (Temp 상태)
    raw: 'show environment | in Temperature'
    arr_num: 0
    grep: ''
    criteria: 'status가 high 또는 critical 일 경우 비정상'
    time: 1

