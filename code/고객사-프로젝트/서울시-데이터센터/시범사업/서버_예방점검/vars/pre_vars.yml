---
### vars 파일
### 점검분류 기입 ---(예방점검, 보안점검, 복제상태점검)
report: 'preventive'
### 실제 FAP 그룹이랑 그룹명 동일하게 지정해야함
inspection_group: '예방점검'

### merged_value --- List 선언
merged_value: []

### 점검항목 --- 장비 별 분류
Linux:
  # - cmd_name: 'CPU' # 대분류 / FAP 상세내역 작업 명
  #   cmd_command: 'top' # 점검 명령어 (점검 명령어 보고서 표출 X 임의 작성 가능)
  #   value: 'int' # python filter 분류 --- 비교 기준 함수 타입(int,str,etc...)
  #   com_value: '80' # python filter 기준값 --- 비교 기준 데이터 값
  #   message: | # 대분류_소분류 행 바꿈 필요 시 \n 또는 아래와 같이 줄 바꿈
  #     CPU 사용 상태 및 용량 점검
  #   raw: "top -bn1 | grep 'Cpu(s)' | awk '{ print 100 - $8 }'" # 점검시 실제 사용할 명령어
  #   arr_num: 0 # List 형 데이터 line별 비교 시 행 기준 배열 자리수
  #   grep: '' # 데이터 파싱을 위한 점검결과 1차 txt파일 저장
  #   criteria: 'cpu 사용률이 80% 이상일 경우 비정상'

  - cmd_name: '기본 운영 프로세스 확인 [ps]'
    cmd_command: ''
    com_value: ''
    value: 'check'
    message: |
      01. 기본 운영 프로세스 확인
    raw: "ps -eo %cpu,comm,pid --sort=-%cpu | awk '!seen[$2]++ {print $1, $2, $3}'"
    arr_num: 0
    grep: ''
    criteria: '기본 운영 프로세스 확인'
    time: 1

  - cmd_name: 'CPU 사용량 중 유휴 상태(Idle Time) [top wa]'
    cmd_command: 'top wa'
    com_value: '10'
    value: 'int'
    message: |
      02. 시스템 기본 상태 확인(CPU)
    raw: "top -b -n 1 | grep 'Cpu(s)' | awk '{print $10}'"
    arr_num: 0
    grep: ''
    criteria: 'wa 값이 10% 이상일 경우 비정상'
    time: 1

  - cmd_name: 'Memory 사용률 [free] '
    cmd_command: 'free'
    com_value: '80'
    value: 'int'
    message: |
      03. 시스템 기본 상태 확인(Memory)
    raw: "free -h | awk '{ print $4 }' | tail -1 | sed 's/[^0-9.]*//g'"
    arr_num: 0
    grep: ''
    criteria: 'Memory 사용률이 80% 이상일 경우 비정상'
    time: 1

  - cmd_name: 'Disk 상태 [df]'
    cmd_command: 'df -h'
    com_value: '80'
    value: 'list_int'
    message: |
      04. 디스크 상태 점검
    unit: '%'
    raw: 'df -h'
    arr_num: 4
    grep: ''
    criteria: 'Disk 사용률이 80% 이상일 경우 비정상'
    time: 1

  - cmd_name: 'LVM으로 관리되는 볼륨 그룹 정보 확인 [vgdisplay]'
    cmd_command: 'vgdisplay'
    com_value: ''
    value: 'check'
    message: |
      05. 디스크의 논리적 관리
    raw: 'vgdisplay -v'
    arr_num: 4
    grep: ''
    criteria: '논리볼륨(LV) 및 물리볼륨(PV) 상태'
    time: 1

  - cmd_name: '네트워크 설정 확인 [netstat]'
    cmd_command: 'netstat'
    com_value: ''
    value: 'check'
    message: |
      06. 네트워크 설정 확인
    raw: 'netstat -rn'
    arr_num: 4
    grep: ''
    criteria: '네트워크 설정 확인'
    time: 1

  - cmd_name: '시간 동기화 상태 확인 [timedatectl]'
    cmd_command: 'ntp'
    com_value: 'yes'
    value: 'notstr'
    message: |
      07. NTP 시간 동기화 상태 확인
    raw: 'timedatectl'
    arr_num: 0
    grep: 'System clock synchronized'
    criteria: 'ntp 시간 동기화 상태 확인'
    time: 1

  - cmd_name: '시스템 계정 취약점 점검 [cat etc/passw]'
    cmd_command: 'etc/passwd'
    com_value: ''
    value: 'check'
    message: |
      08. 시스템 계정 취약점 점검
    raw: "cat /etc/passwd | cut -f1 -d: | egrep '^.{3,16}$'"
    arr_num: 0
    grep: ''
    criteria: '불필요한 계정 확인'
    time: 1

  - cmd_name: '시스템 주요응용설정 취약점 점검 [ps]'
    cmd_command: 'ps'
    com_value: |
      ftp
      telnet
      snmp
      ssh
      xhost
    value: 'str'
    message: |
      09. 시스템 주요응용설정 취약점 점검
    raw: 'ps -ef'
    arr_num: 7
    grep: ''
    criteria: 'ftp,telnet,snmp,ssh,xhost 설정 여부 확인'
    time: 1

  - cmd_name: '시스템 보안설정 취약점 점검 [cat /etc/hosts]'
    cmd_command: 'etc/hosts'
    com_value: ''
    value: 'check'
    message: |
      10. 시스템 보안설정 취약점 점검
    raw: 'cat /etc/hosts'
    arr_num: 0
    grep: ''
    criteria: '시스템 보안설정 취약점 점검'
    time: 1

  - cmd_name: '이벤트 로그 [cat /var/log/messages]'
    cmd_command: 'cat /var/log/messages'
    com_value: |
      error
      fail
      warning
    value: 'str'
    message: |
      11. 시스템 로그파일 점검
    raw: 'cat /var/log/messages | tail -100'
    arr_num: 0
    grep: ''
    criteria: '점검 결과 error,fail,warning 존재 시 비정상'
    time: 1

  # - cmd_name: 'openssl'
  #   cmd_command: 'openssl'
  #   com_value: 'openssl'
  #   value: 'str'
  #   message: |
  #     openssl_점검
  #   raw: 'rpm -qa'
  #   arr_num: 0
  #   grep: ''
  #   criteria: 'openssl 문자열이 존재할 경우 비정상'

Cisco:
  - cmd_name: 'Uptime [show version]'
    cmd_command: 'show version'
    value: 'list_int'
    com_value: '365'
    message: |
      01. 장비 Uptime 점검
    raw: 'show version | in uptime'
    arr_num: 3
    grep: ''
    unit: ''
    criteria: 'Uptime 365 day 이상일 경우 비정상'
    time: 1

  - cmd_name: 'CPU [show processes]'
    cmd_command: 'show processes cpu'
    value: 'list_int'
    com_value: '80'
    message: |
      02. 시스템 기본 상태 확인 (CPU)
    raw: "show processes cpu | include CPU | head -n 1 | awk '{print $4}'"
    arr_num: 0
    grep: ''
    unit: '%'
    criteria: '사용률이 80% 이상 일 경우 비정상.'
    time: 4

  - cmd_name: 'Memory [show processes]'
    cmd_command: 'show processes memory'
    value: 'memory'
    com_value: ''
    message: |
      03. 시스템 기본 상태 확인(Memory)
    raw: 'show processes memory | in Pool Total'
    arr_num: 0
    grep: ''
    criteria: '사용률이 70% 이상 일 경우 비정상.'
    time: 2

  - cmd_name: 'Power [show environment]'
    cmd_command: 'show environment'
    value: 'str'
    com_value: |
      fail
      overtemp
      overload
      shutdown
    message: |
      04. 설비 동작 상태 점검
      (Power 상태)
    raw: 'show environment | in Power'
    arr_num: 0
    grep: ''
    criteria: 'Fail, Overtemp, Overload, Shutdown 결과 존재 시 비정상'
