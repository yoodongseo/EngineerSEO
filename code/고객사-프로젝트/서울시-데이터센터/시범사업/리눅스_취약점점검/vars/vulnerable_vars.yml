---
### vars 파일
### 점검분류 기입 ---(예방점검, 보안점검, 복제상태점검)
inspection_group: "예방점검"
ansible_port: 22
report: "securityvulnerability"
### merged_value --- List 선언
merged_value: []
system: network
file_path: "/fap/report/mcst_vulnercheck/{{ today }}/{{ fap.job_id }}"

Linux:
  - cmd_name: "cat /etc/ssh/sshd_config"
    cmd_command: 'cat /etc/ssh/sshd_config'
    value: "str"
    com_value: "yes"
    message: |
        1. U-01. root 계정 원격 접속 제한 
    raw: "cat /etc/ssh/sshd_config | grep PermitRootLogin"
    multi_raw:
      - ''
    arr_num: 0
    grep: ""
    time: 1
    criteria: "yes 결과 존재 시 비정상"
    tmp_file_path: "../templates/{{ fap['host_ip'] }}_Linux.txt"
    cmd_id: 1
    id: 0001

  - cmd_name: "cat /etc/pam.d/system-auth"
    cmd_command: 'cat /etc/pam.d/system-auth'
    value: "str"
    com_value: "fail"
    message: |
        2. U-02. 패스워드 복잡성 설정   
    raw: "cat /etc/pam.d/system-auth"
    multi_raw:
      - ''
    arr_num: 0
    grep: ""
    time: 1
    criteria: "Fail 결과 존재 시 비정상"
    tmp_file_path: "../templates/{{ fap['host_ip'] }}_Linux.txt"
    cmd_id: 2
    id: 0001

  - cmd_name: "cat /etc/pam.d/system-auth"
    cmd_command: 'cat /etc/pam.d/system-auth'
    value: "str"
    com_value: "passwd"
    message: |
        3. U-03. 계정 잠금 임계값 설정
    raw: "cat /etc/pam.d/system-auth"
    multi_raw:
      - ''
    arr_num: 0
    grep: ""
    time: 1
    criteria: "Fail 결과 존재 시 비정상"
    tmp_file_path: "../templates/{{ fap['host_ip'] }}_Linux.txt"
    cmd_id: 3
    id: 0001

  - cmd_name: "cat /etc/login.defs | grep PASS_MAX_DAYS"
    cmd_command: 'cat /etc/login.defs | grep PASS_MAX_DAYS'
    value: "str"
    com_value: "90"
    message: |
        4. U-04. 패스워드 최대 사용 기간 설정
    raw: "cat /etc/login.defs | grep PASS_MAX_DAYS"
    multi_raw:
      - ''
    arr_num: 0
    grep: ""
    time: 1
    criteria: "90일 이상 시 비정상"
    tmp_file_path: "../templates/{{ fap['host_ip'] }}_Linux.txt"
    cmd_id: 4
    id: 0001

  - cmd_name: "cat /etc/shadow"
    cmd_command: 'cat /etc/shadow'
    value: "notstr"
    com_value: "pwunconv"
    message: |
        5. U-05. 패스워드 파일 보호
    raw: "cat /etc/shadow"
    multi_raw:
      - ''
    arr_num: 0
    grep: ""
    time: 1
    criteria: "Fail 결과 존재 시 비정상"
    tmp_file_path: "../templates/{{ fap['host_ip'] }}_Linux.txt"
    cmd_id: 5
    id: 0001

    
