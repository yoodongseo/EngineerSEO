---
- name: Linux Agent MGMT(TOMCAT)
  hosts: all
  strategy: free
  gather_facts: False
  ignore_errors: False
  ignore_unreachable: True
  tasks:
  - block:
    - name: 변수 호출
      include_vars: ../vars/tomcat_vars.yml

    - name: 1. 연결 상태 점검
      include_tasks: ../tasks/01_lnx_con_tasks.yml

    - name: 2. 사전 검증 작업(JDK 설치 및 톰캣 설치확인)
      include_tasks: ../tasks/02_pre_tasks.yml

    - name: 3. JDK 미설치 -- 설치 진행
      include_tasks: ../tasks/03_jdk_tasks.yml
      when: java_result.failed == true and "openjdk version" not in java_result.stderr

    - name: 4. 톰캣 설치 작업
      include_tasks: ../tasks/04_tomcat_tasks.yml
      when: java_result.failed == false and "openjdk version" in java_result.stderr
    
    always:
      - name: DB SAVE 
        include_tasks: ../tasks/save_data.yml
