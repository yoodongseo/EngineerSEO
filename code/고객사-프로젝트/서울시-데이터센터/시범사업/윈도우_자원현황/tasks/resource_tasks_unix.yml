---
- name: 01. UNIX - OS
  raw: uname -s
  register: os_name

- name: 01. UNIX - OS version
  raw: uname -r
  register: os_version

- name: 01. UNIX Kernel
  raw: isainfo -kv
  register: os_kernel

- name: 01. UNIX - OS, version, type, kernel
  set_fact:
    merged_value: "{{ merged_value | combine({'os_name': os_name.stdout | regex_replace('\r?\n', ''), 'os_type': 'UNIX' }) }}"

- name: 01. UNIX - kernel
  set_fact:
    merged_value: "{{ merged_value | combine({'kernel': os_kernel.stdout | regex_replace('\r?\n', ''), 'os_version': os_version.stdout | regex_replace('\r?\n', '') }) }}"

- name: 02. UNIX - Disk info
  raw: "df -k"
  register: disk_info

- name: 02. UNIX - set_fact
  set_fact:
    df_list: "{{ df_list | default([]) + [ \
              { 'filesystem': (item.split())[0], \
                'size': (((item.split())[1] | float / 1024) | round) | int, \
                'used': (((item.split())[2] | float / 1024) | round) | int, \
                'avail': (((item.split())[3] | float / 1024) | round) | int, \
                'mounted': (item.split())[5] } \
              ] }}"
  loop: "{{ disk_info.stdout_lines[1:] }}"

- name: set_fact
  set_fact:
    merged_value: "{{ merged_value | combine({'disk_list': df_list }) }}"

- name: 03. UNIX - Disk Size
  raw: "iostat -En"
  register: disk_size

- name: 03. Unix - Disk Size
  set_fact:
    disk_sizes: "{{ disk_size.stdout_lines | regex_findall('Size: ([0-9.]+)GB') }}"

- name: Calculate Total Disk Size in MB
  set_fact:
    total_disk_size: "{{ disk_sizes | map('regex_replace', '[^0-9.]', '') | map('float') | sum * 1024 | int }}"

- name: set_fact
  set_fact:
    merged_value: "{{ merged_value | combine({'disk_size': total_disk_size}) }}"

- name: 04. UNIX - Uptime info
  raw: uptime
  register: uptime_info

- name: set_fact
  set_fact:
    merged_value: "{{ merged_value | combine({'uptime': uptime_info.stdout_lines[0].split(',')[0] }) }}"

- name: 05. UNIX - System Info
  raw: prstat -Z 1 1 | grep -v Total | tail -1
  register: system_info

- name: 06. UNIX - CPU Usage
  set_fact:
    cpu_usage: "{{ system_info.stdout.split()[6] | regex_replace('%', '') }}"

- name: set_fact
  set_fact: 
    merged_value: "{{ merged_value | combine({'cpu': cpu_usage }) }}"

- name: 06. UNIX - CPU Cores
  raw: psrinfo -p
  register: cpu_info

- name: 06. UNIX - CPU Cores Set Fact
  set_fact:
    merged_value: "{{ merged_value | combine({'cpu_cores': cpu_info.stdout | int }) }}" # edit by lyh!!! 

- name: 07. UNIX - Memory Usage
  set_fact:
    memory_info: "{{ system_info.stdout.split()[4] | regex_replace('%', '') }}"

- name: set_fact
  set_fact:
    merged_value: "{{ merged_value | combine({'memory': memory_info }) }}"

- name: 07. Get Memory Size
  raw: prtconf | grep "Memory size"
  register: memory_size

- name: 07. Memory Size -2
  set_fact:
    memory_sizes: "{{ memory_size.stdout | regex_replace('[^0-9]', '') }}"

- name: set_fact
  set_fact:
    merged_value: "{{ merged_value | combine({'memory_size': memory_sizes }) }}"

- name: 08. UNIX - User list
  raw: "grep '/bin/sh' /etc/passwd | cut -d: -f1"
  register: user_list

- name: set_fact
  set_fact:
    merged_value: "{{ merged_value | combine({'user_list': user_list.stdout_lines | reject('search', 'setlocale') | select('match', '.+') | list } ) }}"

- name: 10. UNIX - Service list Command
  raw: svcs
  register: svcs_output

- name: 10. UNIX - Service list
  set_fact:
    service_info: "{{ service_info | default([]) + [ \
                { 'name': (item.split())[2].split(':')[1], \
                  'source': ((item.split())[2] | split(':'))[0] , \ 
                  'state': (item.split())[0], \
                  'status': (item.split())[0] } \
                ] }}"
  loop: "{{ svcs_output.stdout_lines[1:] }}"

- name: set_fact
  set_fact:
    merged_value: "{{ merged_value | combine({'service_list': service_info }) }}"

- name: 11. Unix pkginfo
  raw: "pkginfo | grep application"
  register: pkg_info

- name: 11. UNIX - package list
  set_fact:
    package_info: "{{ package_info | default([]) + [ \
                { 'arch': 'null', \
                  'epoch': 'null' , \ 
                  'name': (item.split())[1], \
                  'release': 'null', \
                  'source': 'null', \
                  'version': 'null'} \ 
                ] }}"
  loop: "{{ pkg_info.stdout_lines[1:] }}"

- name: set_fact
  set_fact:
    merged_value: "{{ merged_value | combine({'package_list': package_info }) }}"

# - debug: var=ansible_facts.memtotal_mb
