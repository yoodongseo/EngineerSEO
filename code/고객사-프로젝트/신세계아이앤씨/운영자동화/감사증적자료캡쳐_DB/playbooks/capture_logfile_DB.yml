---
- name: 날짜 및 시간 정보 수집
  hosts: localhost
  gather_facts: false
  tasks:
    - name: "날짜 정보 수집"
      shell: date +"%Y%m%d"
      register: result_date

- name: Capture DB Log
  hosts: all
  gather_facts: true
  ignore_errors: true
  ignore_unreachable: true
  vars:
    data_key: DB_capture_log
    report_type: '로그캡쳐(DB)'
    system: 'DB'
    merged_value: []
  tasks:
  - block:
    - name: 변수 호출
      include_vars: ../vars/playbook_vars.yml

    - name: "연결 상태 체크"
      shell: hostname
      register: result_connection
      failed_when: false
      ignore_unreachable: true
      ignore_errors: true

    - name: 점검 작업 호출
      include_tasks: ../tasks/collect_log_task.yml
      when: result_connection.failed|default(true) == false and ansible_facts.distribution == "RedHat"

    always:
      - name: Make Failure value
        set_fact:
          merged_value: "{{ merged_value + [{\
          'host': inventory_hostname, \
          'host_name': fap.host_name, \
          'is_success': false, \
          'file_path': none, \
          'system': system, \
          'report_type': report_type \
            }] }}"
        delegate_to: localhost
        when: result_connection.failed|default(true) == true or merged_cmd is not defined

      - name: Make content value
        set_fact:
          content_value: "{{ content_value | default({}) | combine({'data_list': merged_value}) }}"
        delegate_to: localhost
        when: merged_value is defined

      - name: Save to DB
        fap.common.save_data:
          content: "{{ content_value }}"
          protocol: http
          hostname: "{{ inventory_hostname }}"
          data_type: report
          data_key: "{{ data_key }}"
          template_id: "{{ fap.template_id | default(omit) }}"
          job_id: "{{ fap.job_id | default(omit) }}"
        delegate_to: localhost
        when: content_value is defined

      - name: "작업을 종료합니다"
        run_once: true
        delegate_to: localhost
        command: echo " "
        changed_when: false
        check_mode: no
        no_log: true