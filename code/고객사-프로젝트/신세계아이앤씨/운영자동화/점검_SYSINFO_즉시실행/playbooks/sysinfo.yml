---

- name: Sysinfo
  hosts: all
  become: true
  gather_facts: true
  ignore_errors: true
  ignore_unreachable: true
  tasks: 
  - name: asd
    include_vars: ../vars/vars_rhel.yml

  - name: merged_value 생성
    set_fact:
      merged_value: []

  - name: CHECK 디렉토리 생성
    file: 
      path: /check
      state: directory
    # run_once: yes

  - name: 스크립트 파일 배포
    ansible.builtin.copy:
      src: "../vars/{{ item.command }}"
      dest: "/check/{{ item.command }}"
    loop: "{{ Linux_sysinfo }}"

  - name: sysinfo 스크립트 실행
    shell: "sh {{ item.command }}"
    args:
      chdir: '/check/'
    register: result_script
    loop: "{{ Linux_sysinfo }}"

  - name: set_fact - result_value
    set_fact:
      result_value: "{{ result_value | default({}) | combine({\
      'host': inventory_hostname, \
      'id': item.id, \
      'name': item.name, \
      'result': result_script.stdout_lines|default(None), \
      'is_success': True, \
      'compare': True }) }}"
    delegate_to: localhost
    loop: "{{ Linux_sysinfo }}"

  - name: set_fact - merged_value
    set_fact:
      merged_value: "{{ merged_value + [result_value] }}"
    delegate_to: localhost

