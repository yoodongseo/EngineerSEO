# step5. 4작업
- name: 리스너 설정 변경 전 lsnrctl stop 작업
  shell: "{{ tnslsnr_kill }}"
  register: result_stop

- name: lsnrctl stop status 명령어 결과 추출
  set_fact:
   dr_recovery_results: "{{ dr_recovery_results|default([]) + [ '='*30 + 'lsnrctl stop(Kill) 명령어 결과' + '='*30 + '\n' + result_stop.stdout ] }}"

# step5. 5작업
- name: DR DB Read Write 모드 변경 및 리스너 설정 추가
  shell: |
    su - oracle -c "cd {{ ORACLE_HOME }}/network/admin &&
    mv {{ LISTENER_ORA }} {{ LISTENER_ORA_DR }} &&
    mv {{ LISTENER_ORA_ORG }} {{ LISTENER_ORA }}"

# step5. 6작업
# - name: DR DB Read Write 모드 변경 및 리스너 설정 추가
- name: 리스너 설정 변경 후 lsnrctl start 작업
  shell: |
    su - oracle -c "cd {{ ORACLE_HOME }}/network/admin &&
    lsnrctl start &&
    lsnrctl status"
  register: result

- name: lsnrctl start status 명령어 결과 추출
  set_fact:
   dr_recovery_results: "{{ dr_recovery_results|default([]) + [ '='*30 + 'lsnrctl start status 명령어 결과' + '='*30 + '\n' + result.stdout ] }}"

- name: DB 복구 결과 백업 ---> localhost
  blockinfile:
    path: "{{ BACKUP_DIR }}/{{ DR_DB_RECOVERY_FILE }}"
    create: true
    block: |
      {{ dr_recovery_results|join('\n') }}
    marker: "# {mark} DB 복구 결과 백업"
  register: blockinfile_result
  delegate_to: localhost
