---
STANDBY_DB_IP: "{{ fap.host_vars.standby_db_ip }}"
# STANDBY_DB_IP: "192.0.2.10"

### oracle sid loop 변수 ###
ORACLE:
- oracle_user: "{{ fap.host_vars.oracle_user_1 | default(none) }}"
  oracle_sid: "{{ fap.host_vars.oracle_sid_1 | default(none) }}"
- oracle_user: "{{ fap.host_vars.oracle_user_2 | default(none) }}"
  oracle_sid: "{{ fap.host_vars.oracle_sid_2 | default(none) }}"
- oracle_user: "{{ fap.host_vars.oracle_user_3 | default(none) }}"
  oracle_sid: "{{ fap.host_vars.oracle_sid_3 | default(none) }}"

#### 백업 디렉토리
BACKUP_DIR: "/fap/report/dr_log/{{ today }}/step3"

#### Step3. DR DB 기동
DR_DB_IP_EXE_FILE: "step3_{{ fap.host_name }}_dr_db_ip_exe.log"
DR_DB_READ_WRITE_FILE: "step3_{{ fap.host_name }}_dr_db_read_write.log"
LSNCRCTL_STATUS: "step3_{{ fap.host_name }}_lsncrctl_status.log"
local_listener_status: "step3_{{ fap.host_name }}_local_listener.log"

DR_DB_IP_EXE_LIST:
- eth: "{{ fap.host_vars.eth0 | default(none) }}"
  ip: "{{ fap.host_vars.ip0 | default(none) }}"
- eth: "{{ fap.host_vars.eth1 | default(none) }}"
  ip: "{{ fap.host_vars.ip1 | default(none) }}"
- eth: "{{ fap.host_vars.eth2 | default(none) }}"
  ip: "{{ fap.host_vars.ip2 | default(none) }}"
- eth: "{{ fap.host_vars.eth3 | default(none) }}"
  ip: "{{ fap.host_vars.ip3 | default(none) }}"
- eth: "{{ fap.host_vars.eth4 | default(none) }}"
  ip: "{{ fap.host_vars.ip4 | default(none) }}"
- eth: "{{ fap.host_vars.eth5 | default(none) }}"
  ip: "{{ fap.host_vars.ip5 | default(none) }}"
