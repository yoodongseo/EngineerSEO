listener_change: |
    export ORACLE_SID="{{ item.oracle_sid }}"
    sqlplus / as sysdba << EOF
    show parameter local_listener;
    alter system set local_listener =
    '(ADDRESS=(PROTOCOL=TCP)(HOST={{ fap.host_vars.vip_1 }})(PORT=1521))',
    '(ADDRESS=(PROTOCOL=TCP)(HOST={{ fap.host_vars.vip_2 }})(PORT=1521))';
    show parameter local_listener;
    exit

    EOF

